<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>HabitOS — Build Better Days</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  /* base = NIGHT (dark) — near-black + deep charcoal, restrained */
  --bg:#08090D;
  --bg2:#0B0D13;
  --surface:#111319;
  --surface2:#171A22;
  --surface3:#1E212C;
  --border:rgba(255,255,255,.07);
  --border2:rgba(255,255,255,.14);
  --text:#F3F4F8;
  --text2:#8B8FA0;
  --text3:#54586A;
  --ok:#34D399;
  --ok-soft:rgba(52,211,153,.14);
  --bad:#FB7185;
  --bad-soft:rgba(251,113,133,.14);
  --warn:#FFB454;
  --warn-soft:rgba(255,180,84,.14);
  --shadow:0 8px 30px rgba(0,0,0,.4);
  --shadow-sm:0 2px 10px rgba(0,0,0,.3);
  --radius:18px;--radius-sm:12px;--radius-lg:26px;

  /* accent — user customizable, default Indigo (premium restrained violet/blue) */
  --accent:#6366F1;
  --accent2:#4F46E5;
  --accent-soft:rgba(99,102,241,.16);
  --accent-contrast:#FFFFFF;

  /* ember — reserved for warm ambient glow + streak/energy accents only, never the primary accent */
  --ember:#FF9552;
  --ember-soft:rgba(255,149,82,.14);

  /* ---- iOS-style liquid glass layer ---- */
  --glass-bg:rgba(22,25,34,.42);
  --glass-bg-strong:rgba(26,29,40,.5);
  --glass-border:rgba(255,255,255,.08);
  --glass-hi:rgba(255,255,255,.07);
  --glass-blur:28px;
  --shadow-widget:0 1px 0 var(--glass-hi) inset,0 10px 28px rgba(0,0,0,.4),0 30px 64px rgba(0,0,0,.28);
  --shadow-widget-sm:0 1px 0 var(--glass-hi) inset,0 6px 18px rgba(0,0,0,.32);
  --shadow-fab:0 12px 28px rgba(0,0,0,.45),0 4px 10px rgba(0,0,0,.35);
  /* ---- glossy transparent sheen for glass cards ---- */
  --glass-shine:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.08) 45%,rgba(255,255,255,.16) 50%,rgba(255,255,255,.08) 55%,transparent 70%);
  --ripple-color:rgba(255,255,255,.4);

  /* ---- semantic ring hues (activity-ring style, theme independent-ish) ---- */
  --ring-week:#2DD4BF;
  --ring-month:#818CF8;

  --f-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  --f-mono:ui-monospace,'SF Mono','Space Mono',Menlo,Consolas,monospace;
}
html.day{
  --bg:#F4F5F9;
  --bg2:#FFFFFF;
  --surface:#FFFFFF;
  --surface2:#F1F3F8;
  --surface3:#E7EAF2;
  --border:#E5E8F0;
  --border2:#D6DAE6;
  --text:#15171F;
  --text2:#63677A;
  --text3:#9AA0B0;
  --ok:#059669;
  --ok-soft:rgba(5,150,105,.1);
  --bad:#E11D48;
  --bad-soft:rgba(225,29,72,.09);
  --warn:#D97706;
  --warn-soft:rgba(217,119,6,.12);
  --shadow:0 12px 30px rgba(30,41,80,.08);
  --shadow-sm:0 2px 10px rgba(30,41,80,.06);
  --accent-contrast:#FFFFFF;
  --ember:#EA7A3B;--ember-soft:rgba(234,122,59,.12);

  --glass-bg:rgba(255,255,255,.4);
  --glass-bg-strong:rgba(255,255,255,.55);
  --glass-border:rgba(255,255,255,.9);
  --glass-hi:rgba(255,255,255,.9);
  --shadow-widget:0 1px 0 var(--glass-hi) inset,0 10px 26px rgba(30,41,80,.08),0 26px 54px rgba(30,41,80,.06);
  --shadow-widget-sm:0 1px 0 var(--glass-hi) inset,0 6px 16px rgba(30,41,80,.07);
  --shadow-fab:0 10px 24px rgba(30,41,80,.18),0 3px 8px rgba(30,41,80,.1);
  --glass-shine:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.35) 55%,transparent 70%);
  --ripple-color:rgba(20,26,44,.16);

  --ring-week:#059669;
  --ring-month:#4F46E5;
}

/* accent swatch options (data-accent on <html>) applied via JS setting --accent/--accent2/--accent-soft */

body{
  background:var(--bg);color:var(--text);font-family:var(--f-body);
  min-height:100vh;overflow-x:hidden;
  transition:background .25s ease,color .25s ease;
  -webkit-font-smoothing:antialiased;
}

/* ============================================================
   AMBIENT BACKGROUND (quiet atmospheric glow, not competing with content)
   ============================================================ */
body{background:
    radial-gradient(ellipse 70% 50% at 15% -10%, rgba(99,102,241,.10), transparent 60%),
    radial-gradient(ellipse 60% 45% at 100% 0%, rgba(255,149,82,.05), transparent 55%),
    var(--bg);
}
html.day body{background:
    radial-gradient(ellipse 70% 50% at 15% -10%, rgba(99,102,241,.06), transparent 60%),
    radial-gradient(ellipse 60% 45% at 100% 0%, rgba(255,149,82,.04), transparent 55%),
    var(--bg);
}
#ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#ambient span{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;
  animation:ambientDrift 40s ease-in-out infinite alternate;
}
#ambient span:nth-child(1){width:42vw;height:42vw;max-width:560px;max-height:560px;top:-16%;left:-12%;background:radial-gradient(circle,var(--accent),transparent 70%)}
#ambient span:nth-child(2){width:34vw;height:34vw;max-width:460px;max-height:460px;bottom:-18%;right:-10%;background:radial-gradient(circle,var(--ember),transparent 72%);animation-delay:-13s;opacity:.16}
#ambient span:nth-child(3){width:26vw;height:26vw;max-width:380px;max-height:380px;top:42%;right:14%;background:radial-gradient(circle,var(--ring-week),transparent 74%);animation-delay:-24s;opacity:.14}
html.day #ambient span{opacity:.16;filter:blur(100px)}
@keyframes ambientDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(3%,4%) scale(1.08)}}
@media(prefers-reduced-motion:reduce){#ambient span{animation:none}}
#app{position:relative;z-index:1}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--accent);color:var(--accent-contrast)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

.mono{font-family:var(--f-mono)}
.muted{color:var(--text2)}
.faint{color:var(--text3)}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{display:flex;min-height:100vh}

/* ---- sidebar (desktop) : floating glass icon-buttons, collapsible, no shared panel ---- */
#sidebar{
  width:96px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  padding:20px 0 20px 22px;position:fixed;left:0;top:0;height:100vh;z-index:120;
  overflow:visible;background:none;
}
#main{margin-left:96px}

.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:36px;height:36px;border-radius:11px;background:linear-gradient(150deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px var(--accent-soft);
}
.brand-mark svg{width:19px;height:19px}
.brand-text{font-family:var(--f-display);font-weight:700;font-size:16.5px;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.brand-text span{display:block;font-family:var(--f-mono);font-weight:500;font-size:9px;letter-spacing:.14em;color:var(--text3);text-transform:uppercase;margin-top:2px}

/* top-left expand/collapse toggle — its own glossy glass circle */
.sidebar-toggle{
  position:fixed;top:20px;left:22px;z-index:130;
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--glass-bg-strong);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 10px 24px rgba(0,0,0,.32);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,background .2s ease;
}
.sidebar-toggle:hover{transform:scale(1.08);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 14px 30px rgba(0,0,0,.4)}
.sidebar-toggle:active{transform:scale(.94)}
.sidebar-toggle svg{width:18px;height:18px;color:var(--text2);transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .2s ease}
.sidebar-toggle .icon-close{position:absolute;transform:rotate(-90deg);opacity:0}
#sidebar.expanded .sidebar-toggle .icon-menu{transform:rotate(90deg);opacity:0}
#sidebar.expanded .sidebar-toggle .icon-close{transform:rotate(0);opacity:1}

.nav-group{display:flex;flex-direction:column;gap:20px;margin-bottom:16px;align-items:flex-start}
.nav-item{
  display:flex;align-items:center;gap:14px;width:auto;height:auto;padding:0;
  font-size:13.5px;font-weight:600;color:var(--text2);
  background:none;border:none;box-shadow:none;
  position:relative;flex-shrink:0;
}
.nav-icon{
  width:58px;height:58px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;position:relative;z-index:2;
  background:var(--glass-bg-strong);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 10px 24px rgba(0,0,0,.3);
  transition:transform .32s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,background .25s ease,border-color .25s ease;
}
.nav-item:hover .nav-icon{transform:scale(1.1) rotate(-6deg);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 14px 30px rgba(0,0,0,.38)}
.nav-item:active .nav-icon{transform:scale(.94)}
.nav-icon svg{width:24px;height:24px;flex-shrink:0;opacity:.85;transition:opacity .2s ease}

/* label "tip" — a liquid-glass droplet that stays fused to the button it belongs to,
   emerging from behind the circle (clipped, not scaled, so the text never distorts) and
   sharing the exact same glass material — meant to read as one continuous blob of liquid,
   not a separate tooltip box. */
.nav-item .nav-tip{
  position:absolute;left:22px;top:50%;z-index:1;
  height:44px;line-height:44px;padding:0 18px 0 40px;
  background:var(--glass-bg-strong);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  color:var(--text);font-family:var(--f-body);font-size:12.5px;font-weight:700;white-space:nowrap;
  border-radius:22px;box-shadow:var(--shadow-widget-sm);pointer-events:none;overflow:hidden;
  transform:translateY(-50%);
  clip-path:inset(0 100% 0 0 round 22px);
  opacity:0;
  transition:clip-path .45s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;
}
.nav-item .nav-tip::after{
  content:'';position:absolute;inset:0;background:var(--glass-shine);opacity:.7;pointer-events:none;
}
#sidebar.expanded .nav-item .nav-tip{display:none}
.nav-item:hover .nav-tip,
.nav-item.active .nav-tip{
  clip-path:inset(0 0 0 0 round 22px);
  opacity:1;
}
.nav-item.active .nav-icon{
  background:linear-gradient(150deg,var(--accent),var(--accent2));border-color:transparent;
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 10px 26px var(--accent-soft);
}
.nav-item.active .nav-icon svg{opacity:1;color:#fff;stroke:#fff}
.side-label{
  font-size:13.5px;font-weight:600;color:var(--text2);white-space:nowrap;
  opacity:0;max-width:0;overflow:hidden;transition:opacity .18s ease,max-width .34s cubic-bezier(.4,0,.2,1);
}
#sidebar.expanded .side-label{opacity:1;max-width:150px}
.nav-item.active .side-label{color:var(--text)}
.nav-item.has-badge::after{display:none}
.nav-badge{
  position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;font-family:var(--f-mono);
  padding:1px 5px;border-radius:20px;min-width:16px;text-align:center;border:2px solid var(--bg);
}
.page-title-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 6px;border-radius:50%;
  background:var(--bad);color:#fff;font-size:11px;font-weight:700;font-family:var(--f-mono);
  box-shadow:0 2px 8px var(--bad-soft);flex-shrink:0;
}
.nav-spacer{flex:1}

.mini-ring-row{display:flex;align-items:center;gap:14px;padding:0;border-radius:0;background:none;border:none}
.mini-ring-text{font-size:11px;line-height:1.35}
.mini-ring-text b{font-family:var(--f-mono);color:var(--text);font-size:12.5px;display:block}

/* ---- topbar (mobile) ---- */
#topbar{
  display:none;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;background:var(--glass-bg);border-bottom:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);backdrop-filter:blur(var(--glass-blur)) saturate(160%);
  position:sticky;top:0;z-index:40;
}
#topbar .brand{padding:0}
#topbar .brand-text{font-size:15px}
#topbar{justify-content:space-between}
#addWrap{position:relative}
#addWrapDesktop{position:relative;flex-shrink:0}
#addDropdown{
  position:absolute;top:calc(100% + 10px);right:0;min-width:190px;
  border-radius:16px;border:1.5px solid var(--glass-border);background:var(--glass-bg-strong);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:var(--shadow-widget);padding:8px;z-index:60;
  opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);transform-origin:top right;
  transition:opacity .16s ease,transform .16s cubic-bezier(.2,.8,.2,1);
}
#addDropdownDesktop{
  position:absolute;top:calc(100% + 10px);right:0;min-width:190px;
  border-radius:16px;border:1.5px solid var(--glass-border);background:var(--glass-bg-strong);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:var(--shadow-widget);padding:8px;z-index:60;
  opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);transform-origin:top right;
  transition:opacity .16s ease,transform .16s cubic-bezier(.2,.8,.2,1);
}
#addDropdown.open{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
#addDropdownDesktop.open{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--glass-bg-strong);border:1px solid var(--glass-border);color:var(--text2);flex-shrink:0;transition:all .15s;
  box-shadow:var(--shadow-widget-sm);
}
.icon-btn:hover{color:var(--text);border-color:var(--border2)}
.icon-btn svg{width:17px;height:17px}

/* ---- main ---- */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#content{flex:1;padding:28px 32px 60px;max-width:980px;width:100%;margin:0 auto}
.page{display:none;animation:pageIn .35s ease}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-title{font-size:23px;font-weight:600;letter-spacing:-.02em}
.page-sub{color:var(--text2);font-size:13px;margin-top:3px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---- "today" header: utility row + date strip + greeting (dashboard) ---- */
.today-utility{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.streak-pill{
  display:flex;align-items:center;gap:6px;background:var(--glass-bg);border:1px solid var(--glass-border);
  padding:7px 13px 7px 10px;border-radius:20px;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--text);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:border-color .15s;
}
.streak-pill:hover{border-color:var(--border2)}

.date-strip{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:4px;scrollbar-width:none;justify-content:center}
.date-strip::-webkit-scrollbar{display:none}
.date-pill{
  flex-shrink:0;min-width:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:10px 4px;border-radius:16px;background:var(--glass-bg);border:1px solid var(--glass-border);
  color:var(--text3);transition:all .18s cubic-bezier(.2,.8,.2,1);
}
.date-pill:hover{border-color:var(--border2);color:var(--text2)}
.date-pill-wd{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.date-pill-num{font-family:var(--f-mono);font-size:15px;font-weight:600;color:var(--text)}
.date-pill.is-today{
  background:linear-gradient(155deg,var(--accent),var(--accent2));border-color:transparent;color:rgba(255,255,255,.75);
  box-shadow:0 6px 18px var(--accent-soft);transform:scale(1.06);
}
.date-pill.is-today .date-pill-num{color:#fff}
.date-pill.is-real-today:not(.is-today){border-color:var(--accent)}
.date-pill-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:1px}

.greet-block{margin-bottom:20px}
.greet-headline{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.greet-sub{color:var(--text2);font-size:13px;margin-top:4px;display:flex;align-items:center;gap:6px}

/* ---- bottom nav (mobile) ---- */
#bottomnav{
  display:none;position:sticky;bottom:0;z-index:40;background:var(--glass-bg);border-top:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);backdrop-filter:blur(var(--glass-blur)) saturate(160%);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.bn-row{display:flex;justify-content:space-around;align-items:center;position:relative}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;flex:1;color:var(--text3);position:relative;transition:color .15s}
.bn-item svg{width:20px;height:20px}
.bn-item span{font-size:9.5px;font-weight:700;letter-spacing:.02em}
.bn-item.active{color:var(--accent)}
.bn-dot{position:absolute;top:2px;right:22%;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.bn-fab{
  flex-shrink:0;width:48px;height:48px;border-radius:16px;margin:0 4px;
  background:linear-gradient(150deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px var(--accent-soft),var(--shadow-fab);transform:translateY(-10px);
  border:1px solid rgba(255,255,255,.18);transition:transform .18s cubic-bezier(.34,1.56,.64,1);color:#fff;
}
.bn-fab:hover{transform:translateY(-12px) scale(1.05)}
.bn-fab:active{transform:translateY(-8px) scale(.96)}
.bn-fab svg{width:22px;height:22px}

@media(max-width:880px){
  #sidebar,.sidebar-toggle{display:none}
  #main{margin-left:0}
  #topbar{display:flex}
  #bottomnav{display:block}
  #content{padding:18px 16px 90px}
}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;
  background:var(--surface);border:1px solid var(--border);color:var(--text);transition:all .15s;white-space:nowrap;
}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--border2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(150deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-contrast);box-shadow:0 6px 18px var(--accent-soft)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}
.icon-only{padding:9px;border-radius:10px}

/* ---- cards ---- */
/* shared frosted-glass surface: flat glossy transparent background (static by default).
   the animated diagonal sheen + lift is added separately, only to cards that are
   actually clickable — see .tpl-card below. Purely-informational cards stay static. */
.card,.stat-card,.widget,.badge,.tpl-card,.hero,.auth-card,.mini-ring-row{
  border:1.5px solid var(--glass-border);background:var(--glass-bg-strong);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  position:relative;overflow:hidden;isolation:isolate;
}
.card{border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-widget-sm)}
.card-flat{
  background:var(--glass-bg);
  border:1.5px solid var(--glass-border);border-radius:var(--radius-sm);padding:14px;
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
}

/* ---- chips / pills ---- */
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
  font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--text2);
}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ---- segmented view tabs (Habits: Daily / Calendar) ---- */
.seg-tabs{
  display:inline-flex;gap:3px;padding:3px;border-radius:13px;margin-bottom:20px;
  background:var(--glass-bg);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
.seg-tab{
  padding:8px 16px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--text2);
  transition:background .15s,color .15s;
}
.seg-tab:hover{color:var(--text)}
.seg-tab.active{background:var(--accent-soft);color:var(--accent)}

/* ---- forms ---- */
.field{margin-bottom:14px}
.field-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);margin-bottom:7px;display:block}
.inp,.sel,.txt{
  width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:11px;
  padding:11px 13px;font-size:13.5px;color:var(--text);transition:border-color .15s;outline:none;
}
.inp:focus,.sel:focus,.txt:focus{border-color:var(--accent)}
.txt{resize:vertical;min-height:64px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.hint{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.4}

.swatch-row{display:flex;gap:8px;flex-wrap:wrap}
.swatch{
  width:32px;height:32px;border-radius:10px;cursor:pointer;border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;flex-shrink:0;
}
.swatch:hover{transform:scale(1.08)}
.swatch.sel{border-color:var(--text)}
.swatch svg{width:14px;height:14px;color:#fff;opacity:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.swatch.sel svg{opacity:1}

.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:150px;overflow-y:auto;padding:2px}
.emoji-opt{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:18px;border-radius:10px;
  background:var(--surface2);border:1.5px solid transparent;cursor:pointer;transition:all .12s;
}
.emoji-opt:hover{background:var(--surface3)}
.emoji-opt.sel{border-color:var(--accent);background:var(--accent-soft)}

.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg-opt{flex:1;text-align:center;padding:8px 6px;border-radius:8px;font-size:12px;font-weight:700;color:var(--text2);transition:all .15s}
.seg-opt.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

/* ---- custom iOS-style time picker (replaces native <input type="time">) ---- */
.time-trigger{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;
}
.time-trigger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time-trigger.is-empty span{color:var(--text3)}
.time-trigger svg{width:16px;height:16px;color:var(--text3);flex-shrink:0}
.tp-modal{max-width:340px}
.tp-wheels{
  position:relative;display:flex;justify-content:center;gap:2px;height:200px;margin:6px 0 2px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28%,#000 72%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 28%,#000 72%,transparent 100%);
}
.tp-col{
  height:200px;width:64px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;
  padding:80px 0;text-align:center;scrollbar-width:none;-ms-overflow-style:none;
}
.tp-col::-webkit-scrollbar{display:none}
.tp-col-ampm{width:60px}
.tp-item{
  height:40px;line-height:40px;scroll-snap-align:center;font-family:var(--f-mono);font-size:19px;
  font-weight:600;color:var(--text3);cursor:pointer;user-select:none;transition:color .15s,font-size .15s;
}
.tp-item.sel{color:var(--text);font-size:22px;font-weight:800}
.tp-highlight{
  position:absolute;left:2px;right:2px;top:50%;height:42px;transform:translateY(-50%);border-radius:13px;
  pointer-events:none;z-index:-1;
  background:var(--glass-bg);border:1.5px solid var(--glass-border);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  box-shadow:var(--shadow-widget-sm);overflow:hidden;
}
.tp-highlight::after{content:'';position:absolute;inset:0;background:var(--glass-shine);opacity:.65;pointer-events:none}

.day-picker{display:flex;gap:6px}
.day-opt{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1.5px solid var(--border);font-size:11px;font-weight:700;color:var(--text2);transition:all .12s;
}
.day-opt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}

.switch{position:relative;width:42px;height:24px;background:var(--surface3);border-radius:20px;flex-shrink:0;transition:background .2s;border:1px solid var(--border)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0}
.switch-row-text b{font-size:13px;font-weight:700;display:block}
.switch-row-text span{font-size:11.5px;color:var(--text2)}

/* ---- modal ---- */
.modal-veil{
  position:fixed;inset:0;background:rgba(4,6,12,.55);backdrop-filter:blur(3px);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-veil.open{opacity:1;pointer-events:auto}
.modal{
  border:1.5px solid var(--glass-border);background:var(--glass-bg-strong);
  border-radius:24px 24px 0 0;width:100%;max-width:480px;
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:var(--shadow-widget);
  max-height:88vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(24px);transition:transform .25s cubic-bezier(.2,.8,.2,1);
}
.modal-veil.open .modal{transform:translateY(0)}
@media(min-width:640px){
  .modal-veil{align-items:center}
  .modal{border-radius:24px;transform:translateY(10px) scale(.98)}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:16px;font-weight:700;font-family:var(--f-display)}
.modal-foot{display:flex;gap:8px;margin-top:18px}
.modal-foot .btn{flex:1}

/* ---- toast ---- */
#toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(360px,90vw)}
.toast{
  background:var(--surface3);color:var(--text);border:1px solid var(--border2);border-radius:12px;
  padding:11px 16px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;animation:toastIn .25s ease;width:100%;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast.leave{animation:toastOut .2s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
.toast .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
.toast.bad .dot{background:var(--bad)}

/* ---- empty state ---- */
.empty{text-align:center;padding:44px 20px;color:var(--text2)}
.empty-icon{width:52px;height:52px;margin:0 auto 14px;opacity:.5}
.empty-icon svg{width:52px;height:52px}
.empty h3{font-size:14.5px;color:var(--text);margin-bottom:5px}
.empty p{font-size:12.5px;max-width:280px;margin:0 auto 16px;line-height:1.5}

/* ============================================================
   DASHBOARD
   ============================================================ */
.hero{
  display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;
  box-shadow:var(--shadow-widget);
  border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:18px;
}
.hero::before{
  content:'';position:absolute;top:-40%;right:-15%;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,var(--accent-soft),transparent 70%);pointer-events:none;
}
.ring-wrap{position:relative;width:132px;height:132px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--border);stroke-width:11}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-family:var(--f-mono);font-size:24px;font-weight:600}
.ring-lbl{font-size:9.5px;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-top:1px}
.hero-side{min-width:0}
.hero-eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;font-weight:600;margin-bottom:6px}
.hero-headline{font-size:19px;font-weight:700;margin-bottom:10px;line-height:1.3}
.hero-stats{display:flex;gap:18px;flex-wrap:wrap}
.hero-stat b{font-family:var(--f-mono);font-size:17px;display:block}
.hero-stat span{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
@media(max-width:560px){.hero{grid-template-columns:1fr;text-align:center;padding:22px 18px}.hero-side{order:2}.ring-wrap{margin:0 auto;order:1}.hero-stats{justify-content:center}}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{border-radius:16px;padding:14px;box-shadow:var(--shadow-widget-sm)}
.stat-card b{font-family:var(--f-mono);font-size:20px;display:block}
.stat-card span{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
@media(max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr)}}

/* momentum strip (mini heatmap teaser) */
.mom-strip-wrap{margin-bottom:20px}
.mom-strip{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.mom-cell{width:13px;height:13px;border-radius:4px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border)}

.sec-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.sec-title h3{font-size:14.5px;font-weight:700}
.sec-title a{font-size:11.5px;color:var(--accent);font-weight:700}

/* ============================================================
   HABIT LIST ITEMS
   ============================================================ */
.hab-list{display:flex;flex-direction:column;gap:10px}
.hab-item{
  display:flex;align-items:center;gap:14px;background:var(--glass-bg);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  border-radius:20px;padding:14px 16px;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s,background .18s;
  position:relative;overflow:hidden;cursor:pointer;box-shadow:var(--shadow-widget-sm);
}
.hab-item:hover{border-color:var(--border2);transform:translateY(-1px)}
.hab-item:active{transform:scale(.98)}
.hab-icon{
  width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:var(--hc-soft,var(--accent-soft));flex-shrink:0;
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset;
}
.hab-info{flex:1;min-width:0}
.hab-name{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.hab-meta{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:6px}
.hab-meta .flame{color:var(--ember)}
.hab-check{
  width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .18s cubic-bezier(.34,1.56,.64,1);
  background:var(--surface2);
}
.hab-check.disabled{opacity:.35;cursor:not-allowed}
.hab-check svg{width:15px;height:15px;opacity:0;transition:opacity .12s}
.hab-item.done .hab-check{background:var(--ok);border-color:var(--ok);transform:scale(1.06)}
.hab-item.done .hab-check svg{opacity:1;color:#fff}
.hab-item.done{border-color:var(--ok-soft);background:linear-gradient(180deg,rgba(52,211,153,.07),transparent 60%),var(--glass-bg)}
.hab-item.missed .hab-check{background:var(--bad);border-color:var(--bad)}
.hab-item.missed .hab-check svg{opacity:1;color:#fff}
.hab-item.missed{border-color:var(--bad-soft);background:linear-gradient(180deg,rgba(251,113,133,.07),transparent 60%),var(--glass-bg)}
.hab-edit-btn{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-shrink:0}
.hab-edit-btn:hover{background:var(--surface2);color:var(--text)}
.hab-edit-btn svg{width:14px;height:14px}

/* ---- habit action sheet (tap a habit card) ---- */
/* ---- circular quick-action row (Edit / Stats / Remove) ---- */
.action-circles{display:flex;justify-content:center;gap:34px;padding:6px 0 22px}
.action-circle{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.action-circle span{font-size:11px;font-weight:600;color:var(--text2)}
.action-circle-btn{
  width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--glass-bg-strong);border:1px solid var(--glass-border);color:var(--text);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .15s,border-color .15s;box-shadow:var(--shadow-widget-sm);
}
.action-circle-btn svg{width:20px;height:20px}
.action-circle:hover .action-circle-btn{transform:translateY(-3px) scale(1.05);border-color:var(--border2)}
.action-circle:active .action-circle-btn{transform:scale(.94)}
.action-circle-btn.danger{color:var(--bad)}
.action-circle:hover .action-circle-btn.danger{background:var(--bad-soft);border-color:var(--bad)}

.action-list{display:flex;flex-direction:column;gap:3px}
.action-row{display:flex;align-items:center;gap:13px;padding:12px 8px;border-radius:14px;cursor:pointer;transition:background .15s}
.action-row:hover{background:var(--surface2)}
.action-row:active{transform:scale(.99)}
.action-row-icon{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;background:var(--surface2);color:var(--text2);
}
.action-row-icon svg{width:16px;height:16px}
.action-row-text{flex:1;min-width:0}
.action-row-text b{font-size:13.5px;font-weight:700;display:block}
.action-row-text span{font-size:11px;color:var(--text2)}
.action-row-chev{color:var(--text3);flex-shrink:0}
.action-row-chev svg{width:15px;height:15px}
.action-row.danger .action-row-icon{background:var(--bad-soft);color:var(--bad)}
.action-row.danger b{color:var(--bad)}
.action-row-sep{height:1px;background:var(--border);margin:6px 2px}

/* ============================================================
   CALENDAR HEATMAP
   ============================================================ */
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cal-nav b{font-size:15px;font-weight:700;min-width:140px;text-align:center;font-family:var(--f-display)}
.cal-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
.cal-table{border-collapse:separate;border-spacing:0;width:100%}
.cal-table th{
  font-size:9px;color:var(--text3);font-weight:700;padding:8px 3px;text-align:center;
  position:sticky;top:0;background:var(--surface);z-index:2;
}
.cal-habit-col{
  text-align:left;padding:9px 12px;min-width:150px;position:sticky;left:0;z-index:3;background:var(--surface);
  border-right:1px solid var(--border);white-space:nowrap;
}
.cal-hname{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
.cal-hname .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-hmeta{font-size:9.5px;color:var(--text3);margin-top:2px;padding-left:15px}
.cal-cell{width:26px;height:26px;text-align:center;padding:2px;border-bottom:1px solid var(--border)}
.cal-dot{
  width:20px;height:20px;border-radius:6px;margin:0 auto;display:flex;align-items:center;justify-content:center;
  background:var(--surface2);cursor:pointer;transition:transform .1s;font-size:10px;
}
.cal-dot:hover{transform:scale(1.15)}
.cal-dot.future{cursor:default;opacity:.35}
.cal-dot.future:hover{transform:none}
.cal-dot.unsched{opacity:.25}
.cal-row:hover .cal-habit-col{background:var(--surface2)}
tr.cal-row:nth-child(odd) .cal-cell{background:rgba(128,128,128,.02)}

/* ============================================================
   STATS
   ============================================================ */
.spark-cell{width:9px;height:22px;border-radius:2.5px;flex-shrink:0;background:var(--surface2)}

.rate-ring-sm{position:relative;width:56px;height:56px;flex-shrink:0}
.rate-ring-sm svg{transform:rotate(-90deg)}

/* ============================================================
   STATS — WIDGET DASHBOARD (bento grid, iOS-inspired)
   ============================================================ */
.widget-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:22px}
.widget{
  grid-column:span 12;border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-widget-sm);
}
.w-5{grid-column:span 5}
.w-7{grid-column:span 7}
.w-3{grid-column:span 3}
.w-4{grid-column:span 4}
.w-12{grid-column:span 12}
@media(max-width:820px){
  .w-5,.w-7,.w-4{grid-column:span 12}
  .w-3{grid-column:span 6}
}
@media(max-width:480px){
  .w-3{grid-column:span 12}
}
.summary-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary-mini{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center}
.summary-mini b{font-size:19px;display:block}
.summary-mini span{font-size:9.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;font-weight:700}

.widget-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.widget-eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text2);font-weight:700}
.widget-headline{font-size:14.5px;font-weight:700;margin-top:2px}
.widget-pill{
  font-family:var(--f-mono);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap;flex-shrink:0;
}
.widget-pill.ok{background:var(--ok-soft);color:var(--ok)}
.widget-pill.bad{background:var(--bad-soft);color:var(--bad)}

/* ---- mini stat tile (4-up row) ---- */
.mini-tile{display:flex;flex-direction:column;gap:9px}
.mini-tile-icon{
  width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);flex-shrink:0;
}
.mini-tile-icon svg{width:17px;height:17px}
.mini-tile b{font-family:var(--f-mono);font-size:21px;line-height:1;display:block}
.mini-tile span{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;font-weight:700}

/* ---- activity rings widget ---- */
.rings-row{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
.rings-svg{flex-shrink:0}
.aring-track{fill:none;stroke:var(--border);opacity:.5}
.aring-a{stroke:var(--accent)}
.aring-b{stroke:var(--ring-week)}
.aring-c{stroke:var(--ring-month)}
.rings-wrap{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.rings-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rings-score{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.rings-score-lbl{font-family:var(--f-mono);font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:2px}
.rings-legend{display:flex;flex-direction:column;gap:11px;min-width:130px}
.rl-row{display:flex;align-items:center;gap:9px;font-size:12px}
.rl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.rl-dot.a{background:var(--accent)}
.rl-dot.b{background:var(--ring-week)}
.rl-dot.c{background:var(--ring-month)}
.rl-row b{font-family:var(--f-mono);margin-left:auto;padding-left:10px}

/* ---- combo chart (weekly trend) ---- */
.combo-chart{width:100%;aspect-ratio:2.4/1;overflow:visible;display:block}
.combo-bar{fill:url(#hosBarGrad)}
.combo-bar.is-today{fill:url(#hosBarGradToday)}
.combo-area{fill:url(#hosAreaGrad)}
.combo-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.combo-dot{fill:var(--bg2);stroke:var(--accent2);stroke-width:1.6}
.combo-dot.is-today{fill:var(--accent)}
.chart-daylabel{font:700 10px var(--f-mono);fill:var(--text2)}
.chart-daylabel.is-today{fill:var(--accent)}

/* ---- category donut ---- */
.donut-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut-svg{display:block}
.donut-track{stroke:var(--border);opacity:.5}
.donut-wrap{position:relative;flex-shrink:0}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center b{font-family:var(--f-mono);font-size:19px;line-height:1}
.donut-center span{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:2px}
.donut-legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:140px}
.dl-row{display:flex;align-items:center;gap:8px;font-size:12px}
.dl-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.dl-row b{margin-left:auto;font-family:var(--f-mono);padding-left:8px}
.dl-row .muted-cat{color:var(--text2)}

/* ---- best-day bars ---- */
.wd-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.wd-label{width:32px;flex-shrink:0;font-size:11px;font-weight:700;color:var(--text2)}
.wd-track{flex:1;height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.wd-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.wd-row.is-best .wd-label{color:var(--accent)}
.wd-val{width:34px;text-align:right;font-family:var(--f-mono);font-size:11px;font-weight:700;flex-shrink:0}

/* ---- insights ---- */
.insight-list{display:flex;flex-direction:column;gap:0}
.insight-row{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.insight-row:last-child{border-bottom:none;padding-bottom:0}
.insight-row:first-child{padding-top:0}
.insight-ic{
  width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:13px;line-height:1;
}
.insight-ic svg{width:14px;height:14px}
.insight-row p{font-size:12.5px;line-height:1.5}

/* ---- consistency heatmap ---- */
.heatmap-scroll{overflow-x:auto;padding-bottom:4px}
.heatmap-inner{min-width:max-content}
.heatmap-months{position:relative;height:15px;margin-bottom:5px}
.heatmap-months span{position:absolute;font-size:9.5px;font-weight:700;color:var(--text3);font-family:var(--f-mono)}
.heatmap-grid{display:flex;gap:3px}
.heat-col{display:flex;flex-direction:column;gap:3px}
.heat-cell{width:12px;height:12px;border-radius:3.5px;background:var(--surface2);border:1px solid var(--border)}
.heat-cell.empty{opacity:.45}
.heat-cell.l0{background:var(--bad-soft);border-color:transparent}
.heat-cell.l1{background:color-mix(in srgb, var(--accent) 30%, var(--surface2));border-color:transparent}
.heat-cell.l2{background:color-mix(in srgb, var(--accent) 55%, var(--surface2));border-color:transparent}
.heat-cell.l3{background:color-mix(in srgb, var(--accent) 78%, var(--surface2));border-color:transparent}
.heat-cell.l4{background:var(--accent);border-color:transparent}
.heatmap-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font-size:10px;color:var(--text3);font-weight:700}
.heatmap-legend .heat-cell{width:10px;height:10px}

/* ---- leaderboard ---- */
.lb-list{display:flex;flex-direction:column;gap:8px}
.lb-row{
  display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border);
  border-radius:14px;padding:10px 12px;transition:transform .15s;
}
.lb-row:hover{transform:translateY(-1px)}
.lb-rank{
  width:24px;height:24px;border-radius:50%;background:var(--surface3);color:var(--text2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;font-weight:700;
}
.lb-rank.gold{background:linear-gradient(150deg,#FFD866,#E8A93B);color:#4A2E00}
.lb-rank.silver{background:linear-gradient(150deg,#E7ECF3,#B9C2D0);color:#33394A}
.lb-rank.bronze{background:linear-gradient(150deg,#E3A776,#B9723E);color:#3C1F00}
.lb-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.lb-info{flex:1;min-width:0}
.lb-info b{font-size:12.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-info span{font-size:10.5px;color:var(--text2)}
.lb-spark{display:flex;gap:2px;flex-shrink:0}
.lb-spark .spark-cell{width:6px;height:18px}
.lb-streaks{display:flex;gap:14px;flex-shrink:0}
.lb-streaks div{text-align:center}
.lb-streaks b{font-family:var(--f-mono);font-size:13px;display:block}
.lb-streaks span{font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
@media(max-width:640px){.lb-spark{display:none}}
@media(max-width:420px){.lb-streaks{gap:8px}.lb-info span{display:none}}

/* ============================================================
   GOALS — "Journey" system: goal → milestones (stages) → tasks (root actions)
   ============================================================ */
.goals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.goal-card{position:relative;padding:20px;cursor:pointer;overflow:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease}
.goal-card::before{
  content:'';position:absolute;top:-40%;right:-30%;width:70%;height:80%;border-radius:50%;
  background:radial-gradient(circle,var(--gc,var(--accent)),transparent 70%);opacity:.16;filter:blur(30px);pointer-events:none;
}
.goal-card::after{
  content:'';position:absolute;inset:0;background:var(--glass-shine);mix-blend-mode:overlay;
  transform:translateX(-120%);pointer-events:none;z-index:1;transition:transform .7s ease;
}
.goal-card:hover::after{transform:translateX(120%)}
.goal-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-widget),0 0 0 1px rgba(255,255,255,.06) inset}
.goal-card.is-done{opacity:.72}
.goal-card-top{display:flex;align-items:flex-start;gap:12px;position:relative;z-index:2}
.goal-icon-badge{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:var(--gc-soft,var(--accent-soft));box-shadow:0 0 0 1px var(--gc-soft,var(--accent-soft)) inset}
.goal-card-title{font-weight:700;font-size:14.5px;letter-spacing:-.01em;line-height:1.3}
.goal-card-note{font-size:11.5px;color:var(--text2);margin-top:3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.goal-menu-btn{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-shrink:0}
.goal-menu-btn:hover{background:var(--surface2);color:var(--text)}
.goal-menu-btn svg{width:16px;height:16px}
.goal-card-mid{display:flex;align-items:center;gap:14px;margin-top:16px;position:relative;z-index:2}
.goal-mini-ring{width:52px;height:52px;flex-shrink:0}
.goal-mini-ring svg{transform:rotate(-90deg)}
.goal-mini-ring .gmr-track{fill:none;stroke:var(--border);stroke-width:5}
.goal-mini-ring .gmr-fill{fill:none;stroke:var(--gc,var(--accent));stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.goal-mini-ring-pct{position:relative;margin-top:-38px;text-align:center;font-family:var(--f-mono);font-size:11px;font-weight:700;pointer-events:none}
.goal-card-stats{flex:1;min-width:0}
.goal-stat-line{font-size:11.5px;color:var(--text2);font-weight:600}
.goal-dots{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.goal-dot{width:6px;height:6px;border-radius:50%;background:var(--border2);flex-shrink:0}
.goal-dot.done{background:var(--gc,var(--accent));box-shadow:0 0 5px var(--gc,var(--accent))}
.goal-card-target{font-size:10.5px;color:var(--text3);margin-top:12px;display:flex;align-items:center;gap:5px;font-weight:600;position:relative;z-index:2}
.goal-card-target svg{width:12px;height:12px}
.goal-status-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--ok-soft);color:var(--ok);margin-top:12px}
.goal-status-chip svg{width:10px;height:10px}
@media(max-width:520px){
  .goals-grid{grid-template-columns:1fr}
}

/* icon / color pickers reused from habit form but namespaced */
.gf-emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:150px;overflow-y:auto}

/* ---- Goal detail: the "Journey" path (milestones as glowing nodes) ---- */
.journey-hero{display:flex;align-items:center;gap:16px;padding:18px 4px 22px;position:relative}
.journey-hero-ring{width:84px;height:84px;flex-shrink:0}
.journey-hero-ring svg{transform:rotate(-90deg)}
.journey-hero-ring .jhr-track{fill:none;stroke:var(--border);stroke-width:8}
.journey-hero-ring .jhr-fill{fill:none;stroke:var(--gc,var(--accent));stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.journey-hero-info{flex:1;min-width:0}
.journey-hero-pct{font-family:var(--f-mono);font-size:26px;font-weight:700;color:var(--accent)}
.journey-hero-sub{font-size:12px;color:var(--text2);margin-top:2px}
.journey-hero-note{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.5}
.journey-wrap{position:relative;padding:4px 0 4px 36px;margin-top:6px}
.journey-line{position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--border);border-radius:2px}
.journey-line-fill{position:absolute;left:15px;top:8px;width:2px;background:linear-gradient(var(--gc,var(--accent)),var(--gc,var(--accent)));border-radius:2px;box-shadow:0 0 8px var(--gc,var(--accent));transition:height .5s cubic-bezier(.2,.8,.2,1)}
.journey-node{position:relative;margin-bottom:12px}
.journey-node-dot{
  position:absolute;left:-36px;top:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;border:2px solid var(--border2);background:var(--surface2);color:var(--text3);
  transition:all .25s cubic-bezier(.2,.8,.2,1);z-index:2;cursor:pointer;
}
.journey-node-dot svg{width:15px;height:15px}
.journey-node.done .journey-node-dot{background:linear-gradient(135deg,var(--gc,var(--accent)),var(--gc2,var(--accent2)));border-color:transparent;color:#fff;box-shadow:0 0 0 4px var(--gc-soft,var(--accent-soft)),0 4px 14px rgba(0,0,0,.3)}
.journey-node.current .journey-node-dot{border-color:var(--gc,var(--accent));color:var(--gc,var(--accent));background:var(--surface);animation:journeyPulse 2.2s ease-in-out infinite}
@keyframes journeyPulse{0%,100%{box-shadow:0 0 0 0 var(--gc-soft,var(--accent-soft))}50%{box-shadow:0 0 0 9px transparent}}
.journey-card{
  border-radius:18px;padding:14px 16px;box-shadow:var(--shadow-widget-sm);cursor:pointer;
  transition:border-color .2s ease,transform .18s ease;
}
.journey-node.done .journey-card{opacity:.68}
.journey-card-head{display:flex;align-items:center;gap:10px}
.journey-card-title{font-weight:700;font-size:13.5px;flex:1;min-width:0}
.journey-node.done .journey-card-title{text-decoration:line-through;text-decoration-color:var(--text3)}
.journey-card-date{font-size:10.5px;color:var(--text3);font-weight:600;white-space:nowrap}
.journey-card-chev{width:16px;height:16px;color:var(--text3);flex-shrink:0;transition:transform .2s}
.journey-card-chev svg{width:16px;height:16px}
.journey-card.open .journey-card-chev{transform:rotate(90deg)}
.journey-progress-row{display:flex;align-items:center;gap:8px;margin-top:9px}
.journey-progress-bar{flex:1;height:5px;border-radius:3px;background:var(--surface3);overflow:hidden}
.journey-progress-fill{height:100%;background:linear-gradient(90deg,var(--gc,var(--accent)),var(--gc2,var(--accent2)));border-radius:3px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.journey-progress-lbl{font-size:10px;color:var(--text3);font-family:var(--f-mono);font-weight:700;flex-shrink:0}
.journey-tasks{margin-top:12px;display:flex;flex-direction:column;gap:6px;animation:pageIn .2s ease}
.jtask{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;background:var(--surface2);border:1px solid var(--border)}
.jtask.done{opacity:.55}
.jtask-check{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;transition:all .15s}
.jtask-check svg{width:12px;height:12px}
.jtask.done .jtask-check{background:var(--gc,var(--accent));border-color:var(--gc,var(--accent));color:#fff}
.jtask-text{flex:1;font-size:12.5px;min-width:0;word-break:break-word}
.jtask.done .jtask-text{text-decoration:line-through;color:var(--text3)}
.jtask-del{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-shrink:0}
.jtask-del svg{width:13px;height:13px}
.jtask-del:hover{background:var(--bad-soft);color:var(--bad)}
.jtask-add-row{display:flex;gap:6px;margin-top:4px}
.jtask-add-row input{flex:1}
.journey-milestone-empty-note{font-size:11px;color:var(--text3);margin-top:8px;line-height:1.5}
.journey-milestone-toggle-done{margin-top:9px}
.journey-add-node{position:relative}
.journey-add-node .journey-node-dot{border-style:dashed;background:transparent}
.journey-add-card{
  border:1.5px dashed var(--border2);border-radius:14px;padding:9px 14px;width:100%;
  display:flex;align-items:center;justify-content:center;gap:6px;
  color:var(--text2);font-weight:600;font-size:12.5px;background:transparent;box-shadow:none;
}
.journey-add-card svg{width:14px;height:14px;flex-shrink:0}
.journey-add-card:hover{border-color:var(--gc,var(--accent));color:var(--gc,var(--accent))}
.journey-add-form{border-radius:16px;padding:12px 14px;box-shadow:var(--shadow-widget-sm);display:flex;flex-direction:column;gap:8px}
.journey-add-form .field-row2{display:flex;gap:8px}
.journey-add-form .field-row2 input:first-child{flex:1}
.journey-add-form .field-row2 .btn{white-space:nowrap}
.journey-empty{text-align:center;padding:36px 12px}

@media(max-width:520px){
  .journey-hero{flex-direction:column;text-align:center;padding:14px 4px 20px;gap:12px}
  .journey-wrap{padding-left:30px}
  .journey-line,.journey-line-fill{left:13px}
  .journey-node-dot{left:-30px;width:28px;height:28px;font-size:11px}
  .journey-add-form .field-row2{flex-direction:column;align-items:stretch}
}

/* ============================================================
   GOALS — SMART VIEW: floating "mind" universe + scroll-driven road
   ============================================================ */
.goals-view-toggle{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:3px;gap:2px;flex-shrink:0}
.goals-view-toggle button{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--text2);transition:all .18s ease;white-space:nowrap}
.goals-view-toggle button svg{width:14px;height:14px}
.goals-view-toggle button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.goals-view-toggle button:hover:not(.active){color:var(--text)}

/* ---- brain universe (collapsed smart view) ---- */
/* sized to 80% of the original footprint, and clipped into an actual
   two-hemisphere brain silhouette (see #brainClipShape defs in <body>) */
.brain-shell{
  position:relative;margin:8px auto 10px;width:100%;max-width:608px;aspect-ratio:1/1;max-height:512px;
  clip-path:url(#brainClipShape);-webkit-clip-path:url(#brainClipShape);
  background:
    radial-gradient(circle at 30% 22%, var(--accent-soft), transparent 55%),
    radial-gradient(circle at 76% 68%, var(--ember-soft), transparent 52%),
    radial-gradient(ellipse at 50% 48%, color-mix(in srgb, var(--accent) 7%, var(--surface)) 0%, var(--surface) 72%);
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow-widget),0 0 0 1px rgba(255,255,255,.03) inset;
  overflow:hidden;isolation:isolate;
  animation:brainPulse 5.5s ease-in-out infinite;
  transition:filter .25s ease;
}
@keyframes brainPulse{
  0%,100%{filter:brightness(1) saturate(1)}
  50%{filter:brightness(1.045) saturate(1.08)}
}
.brain-shell:hover{filter:brightness(1.06)}
@media(prefers-reduced-motion:reduce){.brain-shell{animation:none}}
.brain-aura{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 55%,var(--bg) 105%);opacity:.5;pointer-events:none;z-index:1}
.brain-grid{
  position:absolute;inset:0;opacity:.4;pointer-events:none;z-index:1;
  background-image:radial-gradient(var(--border2) 1px,transparent 1px);background-size:24px 24px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,black 55%,transparent 90%);mask-image:radial-gradient(circle at 50% 50%,black 55%,transparent 90%);
}
html.day .brain-grid{opacity:.26}
/* subtle gyri/sulci folds texture so the shell reads as brain tissue, not a flat blob */
.brain-folds{
  position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:overlay;opacity:.85;
  background-image:
    repeating-radial-gradient(circle at 32% 28%, transparent 0 9px, rgba(255,255,255,.05) 9px 11px, transparent 11px 20px),
    repeating-radial-gradient(circle at 70% 66%, transparent 0 8px, rgba(255,255,255,.045) 8px 10px, transparent 10px 18px),
    repeating-radial-gradient(circle at 50% 82%, transparent 0 7px, rgba(0,0,0,.05) 7px 9px, transparent 9px 16px);
}
html.day .brain-folds{opacity:.5;mix-blend-mode:multiply}
/* longitudinal fissure — the groove separating the two hemispheres */
.brain-fissure{
  position:absolute;top:5%;bottom:9%;left:50%;width:2px;transform:translateX(-50%);
  background:linear-gradient(to bottom, transparent, var(--border2) 14%, var(--border2) 86%, transparent);
  opacity:.55;z-index:1;pointer-events:none;
}
/* thin animated "blood vessels" + pulsing "synapse" nodes drifting inside the brain */
.brain-vessels{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:visible}
.brain-vein{fill:none;stroke:var(--accent);stroke-width:.4;opacity:.32;stroke-linecap:round;stroke-dasharray:5 4;animation-name:veinFlow;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes veinFlow{to{stroke-dashoffset:-18}}
.brain-neuron{fill:var(--accent);opacity:.5;animation-name:neuronPulse;animation-timing-function:ease-in-out;animation-iteration-count:infinite;transform-box:fill-box;transform-origin:center}
@keyframes neuronPulse{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:.95;transform:scale(1.6)}}
.brain-shell:hover .brain-vein{opacity:.6}
.brain-shell:hover .brain-neuron{opacity:.85}
@media(prefers-reduced-motion:reduce){.brain-vein,.brain-neuron{animation:none}}
/* each orb sits in a static-position slot (percent-based) that JS nudges away
   from the cursor; the orb itself keeps its own faster ambient float so the
   two motions compose without fighting each other */
.brain-orb-slot{
  position:absolute;z-index:3;transform:translate(-50%,-50%);
  transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform;
}
.brain-orb{
  position:relative;width:var(--size);height:var(--size);border-radius:50%;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;text-align:center;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.4),transparent 46%),var(--gc,var(--accent));
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 8px 22px rgba(0,0,0,.35),0 0 26px var(--gc-soft,var(--accent-soft));

.quick-theme-dd{
  position:absolute;top:100%;right:0;padding-top:12px;min-width:216px;z-index:150;
  opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);transform-origin:top right;
  transition:opacity .16s ease,transform .16s cubic-bezier(.2,.8,.2,1);
}
#quickThemeWrap:hover .quick-theme-dd,
.quick-theme-dd:hover{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.quick-theme-dd-inner{
  border-radius:16px;border:1.5px solid var(--glass-border);background:var(--glass-bg-strong);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:var(--shadow-widget);padding:14px;
}
.quick-theme-dd-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:11px}
.quick-theme-swatches{display:flex;flex-wrap:wrap;gap:10px}
.quick-theme-swatches .accent-swatch{width:32px;height:32px}
.quick-theme-swatches .accent-swatch svg{width:13px;height:13px}
#profileBtn{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;overflow:hidden;
  border:1.5px solid var(--glass-border);background:var(--glass-bg-strong);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-widget-sm);
  font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--text);transition:transform .15s,border-color .15s;
}
#profileBtn:hover{transform:scale(1.05);border-color:var(--border2)}
#profileBtn img{width:100%;height:100%;object-fit:cover;display:block}
#profileDropdown{
  position:absolute;top:calc(100% + 10px);right:0;min-width:216px;
  border-radius:18px;border:1.5px solid var(--glass-border);background:var(--glass-bg-strong);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:var(--shadow-widget);padding:8px;
  opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);transform-origin:top right;
  transition:opacity .16s ease,transform .16s cubic-bezier(.2,.8,.2,1);
}
#profileDropdown.open{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.profile-dd-head{display:flex;align-items:center;gap:10px;padding:8px 10px 10px}
.profile-dd-head b{font-size:12.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.profile-dd-head span{font-size:10.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;display:block}
.profile-dd-divider{height:1px;background:var(--glass-border);margin:4px 6px}
.profile-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border-radius:11px;
  font-size:12.5px;font-weight:600;color:var(--text);transition:background .12s;text-align:left;
}
.profile-item svg{width:16px;height:16px;flex-shrink:0;color:var(--text2)}
.profile-item:hover{background:var(--surface2)}
.profile-item.danger{color:var(--bad)}
.profile-item.danger svg{color:var(--bad)}

/* ============================================================
   AUTH GATE (Firebase Google Sign-In)
   ============================================================ */
#authGate{
  position:fixed;inset:0;z-index:999;background:color-mix(in srgb, var(--bg) 82%, transparent);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.auth-card{
  width:100%;max-width:360px;border-radius:var(--radius-lg);padding:34px 28px;text-align:center;box-shadow:var(--shadow-widget);
}
.auth-brand{width:52px;height:52px;border-radius:15px;margin:0 auto 18px;background:linear-gradient(150deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px var(--accent-soft)}
.auth-brand svg{width:26px;height:26px}
.auth-title{font-family:var(--f-display);font-size:21px;font-weight:700;margin-bottom:8px}
.auth-sub{color:var(--text2);font-size:13.5px;line-height:1.55;margin-bottom:24px}
.auth-google-btn{
  width:100%;background:var(--text);color:var(--bg);border:none;height:46px;border-radius:12px;
  font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  transition:all .15s;
}
.auth-google-btn:hover{opacity:.9;transform:translateY(-1px)}
.auth-google-btn:disabled{opacity:.55;pointer-events:none}
.auth-status{margin-top:14px;font-size:12px;color:var(--text3);min-height:16px}
.auth-spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border2);border-top-color:var(--accent);margin:0 auto 16px;animation:authspin .7s linear infinite}
@keyframes authspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="ambient"><span></span><span></span><span></span></div>

        C0.86,0.86 0.77,0.92 0.68,0.90
        C0.64,0.97 0.54,0.99 0.50,0.94

<!-- ============ AUTH GATE ============ -->
<div id="authGate">
  <div class="auth-card">
    <div class="auth-brand"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg></div>
    <div class="auth-title">HabitOS</div>
    <div class="auth-sub" id="authSub">Checking sign-in…</div>
    <div class="auth-spinner" id="authSpinner"></div>
    <button class="auth-google-btn" id="authGoogleBtn" onclick="signInWithGoogle()" style="display:none">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.6 0-14.1 4.3-17.4 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 34.9 26.9 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.6 5.1C9.8 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.6 5.6C40.8 36.4 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <div class="auth-status" id="authStatus"></div>
  </div>
</div>

<div id="app" style="display:none">

  <!-- ============ PROFILE MENU (top-right) ============ -->
  <div id="profileWrap">
    <div id="quickThemeWrap">
      <button id="quickThemeBtn" class="icon-btn" onclick="toggleQuickTheme()" aria-label="Toggle light/dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div id="quickThemeDropdown" class="quick-theme-dd">
        <div class="quick-theme-dd-inner">
          <div class="quick-theme-dd-label">Accent color</div>
          <div class="quick-theme-swatches" id="quickThemeSwatches"></div>
        </div>
      </div>
    </div>
    <div id="addWrapDesktop">
      <button id="addBtnDesktop" class="icon-btn" onclick="toggleAddMenu(event,true)" title="Add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div id="addDropdownDesktop">
        <button class="profile-item" onclick="closeAddMenu();openHabitModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          New Habit
        </button>
        <button class="profile-item" onclick="closeAddMenu();openTemplateModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>
          Habit Template
        </button>
        <button class="profile-item" onclick="closeAddMenu();openGoalModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
          New Goal
        </button>
      </div>
    </div>
    <div id="dateNavWrap" class="date-nav-mini">
      <button class="date-nav-btn" onclick="shiftDashDate(-1)" aria-label="Previous day">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button class="date-nav-current" onclick="toggleDatePicker(event)" title="Pick a date">

      <button class="date-nav-btn" onclick="shiftDashDate(1)" aria-label="Next day">

      </button>
      <div id="datePickerDropdown" class="date-picker-dd">
        <div class="date-picker-inner">
          <div class="dp-head">
            <button class="dp-nav-btn" onclick="dpNav(-1)" aria-label="Previous month">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <b id="dpMonthLabel">Month Year</b>
            <button class="dp-nav-btn" onclick="dpNav(1)" aria-label="Next month">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
          <div class="dp-weekdays" id="dpWeekdays"></div>
          <div class="dp-grid" id="dpGrid"></div>
          <button class="dp-today-btn" onclick="dpJumpToday()">Jump to today</button>
        </div>
      </div>
    </div>
    <button id="profileBtn" onclick="toggleProfileMenu(event)" title="Account"></button>
    <div id="profileDropdown">
      <div class="profile-dd-head" id="profileDdHead"></div>
      <div class="profile-dd-divider"></div>
      <button class="profile-item" onclick="goToSettingsSection('settingsAccountCard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Profile
      </button>
      <button class="profile-item" onclick="goToSettingsSection('settingsPreferencesCard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M4 12a8 8 0 1 1 3.2 6.4M4 12H2m2 0a8 8 0 0 1 3.2-6.4"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1M18.4 18.4l-2.1-2.1M7.7 7.7 5.6 5.6"/></svg>
        Settings
      </button>
      <button class="profile-item" onclick="goToSettingsSection('settingsAppearanceCard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-4-4 3 3 0 0 1 1-2.2A9.96 9.96 0 0 0 12 2Z"/></svg>
        Customization
      </button>
      <div class="profile-dd-divider"></div>
      <button class="profile-item danger" onclick="closeProfileMenu();signOutUser()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
        Log out
      </button>
    </div>
  </div>

  <!-- ============ SIDEBAR (desktop) : floating glass icon dock ============ -->
  <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="Expand menu" title="Expand menu">
    <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <aside id="sidebar">
    <nav class="nav-group" id="sideNav"></nav>
  </aside>

  <div id="main">
    <!-- ============ TOPBAR (mobile) ============ -->
    <header id="topbar">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg></div>
        <div class="brand-text">HabitOS</div>
      </div>
    </header>

    <!-- ============ PAGE CONTENT ============ -->
    <main id="content">

      <!-- ---------- DASHBOARD ---------- -->
      <section class="page" id="page-dashboard"></section>

      <!-- ---------- CALENDAR ---------- -->
      <section class="page" id="page-calendar"></section>

      <!-- ---------- GOALS ---------- -->
      <section class="page" id="page-goals"></section>

      <!-- ---------- STATS ---------- -->
      <section class="page" id="page-stats"></section>

      <!-- ---------- ACHIEVEMENTS ---------- -->
      <section class="page" id="page-achievements"></section>

      <!-- ---------- SETTINGS ---------- -->
      <section class="page" id="page-settings"></section>

    </main>

    <!-- ============ BOTTOM NAV (mobile) ============ -->
    <nav id="bottomnav">
      <div class="bn-row" id="bnRow"></div>
    </nav>
  </div>
</div>

<!-- ============ MORE SHEET (mobile) ============ -->
<div class="modal-veil" id="moreVeil" onclick="if(event.target===this)closeMore()">
  <div class="modal" style="max-width:420px">
    <div class="modal-head"><div class="modal-title">More</div><button class="icon-btn" onclick="closeMore()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div id="moreSheetBody" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
</div>

<!-- ============ ADD/EDIT HABIT MODAL ============ -->
<div class="modal-veil" id="habitVeil" onclick="if(event.target===this)closeHabitModal()">
  <div class="modal" id="habitModal"></div>
</div>

<!-- ============ HABIT ACTION SHEET (tap a habit card) ============ -->
<div class="modal-veil" id="habitActionVeil" onclick="if(event.target===this)closeHabitAction()">
  <div class="modal" id="habitActionModal" style="max-width:420px"></div>
</div>

<!-- ============ PER-HABIT STATS MODAL ============ -->
<div class="modal-veil" id="habitStatsVeil" onclick="if(event.target===this)closeHabitStats()">
  <div class="modal" id="habitStatsModal" style="max-width:480px"></div>
</div>

<!-- ============ ADD/EDIT GOAL MODAL ============ -->
<div class="modal-veil" id="goalVeil" onclick="if(event.target===this)closeGoalModal()">
  <div class="modal" id="goalModal" style="max-width:480px"></div>
</div>

<!-- ============ GOAL JOURNEY (detail) MODAL — milestones + tasks ============ -->
<div class="modal-veil" id="goalDetailVeil" onclick="if(event.target===this)closeGoalDetail()">
  <div class="modal" id="goalDetailModal" style="max-width:560px;max-height:88vh;overflow-y:auto"></div>
</div>

<!-- ============ TIME PICKER SHEET (custom iOS-style wheel, theme-aware) ============ -->
<div class="modal-veil" id="timePickerVeil" onclick="if(event.target===this)closeTimePicker()">
  <div class="modal tp-modal" id="timePickerModal">
    <div class="modal-head"><div class="modal-title">Reminder time</div><button class="icon-btn" onclick="closeTimePicker()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="tp-wheels">
      <div class="tp-highlight"></div>
