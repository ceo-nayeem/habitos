<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>HabitOS — Build Better Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  /* base = NIGHT (dark) */
  --bg:#0B0F1A;
  --bg2:#0F1420;
  --surface:#141A28;
  --surface2:#1B2333;
  --surface3:#242D42;
  --border:#232B3D;
  --border2:#2C3550;
  --text:#E8ECF4;
  --text2:#8992A9;
  --text3:#4A5268;
  --ok:#22C55E;
  --ok-soft:rgba(34,197,94,.14);
  --bad:#FB4D5C;
  --bad-soft:rgba(251,77,92,.14);
  --warn:#F5B700;
  --warn-soft:rgba(245,183,0,.14);
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --shadow-sm:0 2px 10px rgba(0,0,0,.25);
  --radius:16px;--radius-sm:10px;--radius-lg:22px;

  /* accent — user customizable, default Ember */
  --accent:#FF6B35;
  --accent2:#E8551F;
  --accent-soft:rgba(255,107,53,.16);
  --accent-contrast:#0B0F1A;

  --f-display:'Space Grotesk',sans-serif;
  --f-body:'Plus Jakarta Sans',sans-serif;
  --f-mono:'IBM Plex Mono',monospace;
}
html.day{
  --bg:#F3F5FA;
  --bg2:#FFFFFF;
  --surface:#FFFFFF;
  --surface2:#F1F4F9;
  --surface3:#E7EBF3;
  --border:#E3E7F0;
  --border2:#D5DAE6;
  --text:#161B2C;
  --text2:#5B6478;
  --text3:#9AA2B5;
  --ok:#16A34A;
  --ok-soft:rgba(22,163,74,.10);
  --bad:#E11D48;
  --bad-soft:rgba(225,29,72,.09);
  --warn:#D97706;
  --warn-soft:rgba(217,119,6,.12);
  --shadow:0 12px 30px rgba(30,41,80,.08);
  --shadow-sm:0 2px 10px rgba(30,41,80,.06);
  --accent-contrast:#FFFFFF;
}

/* accent swatch options (data-accent on <html>) applied via JS setting --accent/--accent2/--accent-soft */

body{
  background:var(--bg);color:var(--text);font-family:var(--f-body);
  min-height:100vh;overflow-x:hidden;
  transition:background .25s ease,color .25s ease;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--accent);color:var(--accent-contrast)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

.mono{font-family:var(--f-mono)}
.muted{color:var(--text2)}
.faint{color:var(--text3)}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{display:flex;min-height:100vh}

/* ---- sidebar (desktop) ---- */
#sidebar{
  width:236px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 26px}
.brand-mark{
  width:36px;height:36px;border-radius:11px;background:linear-gradient(150deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px var(--accent-soft);
}
.brand-mark svg{width:19px;height:19px}
.brand-text{font-family:var(--f-display);font-weight:700;font-size:16.5px;letter-spacing:-.02em;line-height:1.1}
.brand-text span{display:block;font-family:var(--f-mono);font-weight:500;font-size:9px;letter-spacing:.14em;color:var(--text3);text-transform:uppercase;margin-top:2px}

.nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;
  font-size:13.5px;font-weight:600;color:var(--text2);transition:background .15s,color .15s;position:relative;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item.active svg{opacity:1}
.nav-badge{
  margin-left:auto;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;font-family:var(--f-mono);
  padding:1px 6px;border-radius:20px;min-width:16px;text-align:center;
}
.nav-spacer{flex:1}

.side-foot{border-top:1px solid var(--border);padding-top:14px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.mini-ring-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.mini-ring-text{font-size:11px;line-height:1.35}
.mini-ring-text b{font-family:var(--f-mono);color:var(--text);font-size:12.5px;display:block}

/* ---- topbar (mobile) ---- */
#topbar{
  display:none;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:40;
}
#topbar .brand{padding:0}
#topbar .brand-text{font-size:15px}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--border);color:var(--text2);flex-shrink:0;transition:all .15s;
}
.icon-btn:hover{color:var(--text);border-color:var(--border2)}
.icon-btn svg{width:17px;height:17px}

/* ---- main ---- */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#content{flex:1;padding:28px 32px 60px;max-width:980px;width:100%;margin:0 auto}
.page{display:none;animation:pageIn .35s ease}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-title{font-size:24px;font-weight:700}
.page-sub{color:var(--text2);font-size:13px;margin-top:3px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---- bottom nav (mobile) ---- */
#bottomnav{
  display:none;position:sticky;bottom:0;z-index:40;background:var(--bg2);border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.bn-row{display:flex;justify-content:space-around}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;flex:1;color:var(--text3);position:relative}
.bn-item svg{width:20px;height:20px}
.bn-item span{font-size:9.5px;font-weight:700;letter-spacing:.02em}
.bn-item.active{color:var(--accent)}
.bn-dot{position:absolute;top:2px;right:22%;width:6px;height:6px;border-radius:50%;background:var(--bad)}

@media(max-width:880px){
  #sidebar{display:none}
  #topbar{display:flex}
  #bottomnav{display:block}
  #content{padding:18px 16px 90px}
}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;
  background:var(--surface);border:1px solid var(--border);color:var(--text);transition:all .15s;white-space:nowrap;
}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--border2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(150deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-contrast);box-shadow:0 6px 18px var(--accent-soft)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}
.icon-only{padding:9px;border-radius:10px}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card-flat{background:var(--surface2);border-radius:var(--radius-sm);padding:14px}

/* ---- chips / pills ---- */
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
  font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--text2);
}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ---- forms ---- */
.field{margin-bottom:14px}
.field-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);margin-bottom:7px;display:block}
.inp,.sel,.txt{
  width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:11px;
  padding:11px 13px;font-size:13.5px;color:var(--text);transition:border-color .15s;outline:none;
}
.inp:focus,.sel:focus,.txt:focus{border-color:var(--accent)}
.txt{resize:vertical;min-height:64px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.hint{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.4}

.swatch-row{display:flex;gap:8px;flex-wrap:wrap}
.swatch{
  width:32px;height:32px;border-radius:10px;cursor:pointer;border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;flex-shrink:0;
}
.swatch:hover{transform:scale(1.08)}
.swatch.sel{border-color:var(--text)}
.swatch svg{width:14px;height:14px;color:#fff;opacity:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.swatch.sel svg{opacity:1}

.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:150px;overflow-y:auto;padding:2px}
.emoji-opt{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:18px;border-radius:10px;
  background:var(--surface2);border:1.5px solid transparent;cursor:pointer;transition:all .12s;
}
.emoji-opt:hover{background:var(--surface3)}
.emoji-opt.sel{border-color:var(--accent);background:var(--accent-soft)}

.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg-opt{flex:1;text-align:center;padding:8px 6px;border-radius:8px;font-size:12px;font-weight:700;color:var(--text2);transition:all .15s}
.seg-opt.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

.day-picker{display:flex;gap:6px}
.day-opt{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1.5px solid var(--border);font-size:11px;font-weight:700;color:var(--text2);transition:all .12s;
}
.day-opt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}

.switch{position:relative;width:42px;height:24px;background:var(--surface3);border-radius:20px;flex-shrink:0;transition:background .2s;border:1px solid var(--border)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0}
.switch-row-text b{font-size:13px;font-weight:700;display:block}
.switch-row-text span{font-size:11.5px;color:var(--text2)}

/* ---- modal ---- */
.modal-veil{
  position:fixed;inset:0;background:rgba(4,6,12,.55);backdrop-filter:blur(3px);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-veil.open{opacity:1;pointer-events:auto}
.modal{
  background:var(--bg2);border:1px solid var(--border);border-radius:22px 22px 0 0;width:100%;max-width:480px;
  max-height:88vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(24px);transition:transform .25s cubic-bezier(.2,.8,.2,1);
}
.modal-veil.open .modal{transform:translateY(0)}
@media(min-width:640px){
  .modal-veil{align-items:center}
  .modal{border-radius:22px;transform:translateY(10px) scale(.98)}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:16px;font-weight:700;font-family:var(--f-display)}
.modal-foot{display:flex;gap:8px;margin-top:18px}
.modal-foot .btn{flex:1}

/* ---- toast ---- */
#toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(360px,90vw)}
.toast{
  background:var(--surface3);color:var(--text);border:1px solid var(--border2);border-radius:12px;
  padding:11px 16px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;animation:toastIn .25s ease;width:100%;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast.leave{animation:toastOut .2s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
.toast .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
.toast.bad .dot{background:var(--bad)}

/* ---- empty state ---- */
.empty{text-align:center;padding:44px 20px;color:var(--text2)}
.empty-icon{width:52px;height:52px;margin:0 auto 14px;opacity:.5}
.empty h3{font-size:14.5px;color:var(--text);margin-bottom:5px}
.empty p{font-size:12.5px;max-width:280px;margin:0 auto 16px;line-height:1.5}

/* ============================================================
   DASHBOARD
   ============================================================ */
.hero{
  display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;
  background:linear-gradient(155deg,var(--surface),var(--bg2));border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:18px;position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-40%;right:-15%;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,var(--accent-soft),transparent 70%);pointer-events:none;
}
.ring-wrap{position:relative;width:132px;height:132px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--border);stroke-width:11}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-family:var(--f-mono);font-size:24px;font-weight:600}
.ring-lbl{font-size:9.5px;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-top:1px}
.hero-side{min-width:0}
.hero-eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;font-weight:600;margin-bottom:6px}
.hero-headline{font-size:19px;font-weight:700;margin-bottom:10px;line-height:1.3}
.hero-stats{display:flex;gap:18px;flex-wrap:wrap}
.hero-stat b{font-family:var(--f-mono);font-size:17px;display:block}
.hero-stat span{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
@media(max-width:560px){.hero{grid-template-columns:1fr;text-align:center;padding:22px 18px}.hero-side{order:2}.ring-wrap{margin:0 auto;order:1}.hero-stats{justify-content:center}}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.stat-card b{font-family:var(--f-mono);font-size:20px;display:block}
.stat-card span{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
@media(max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr)}}

/* momentum strip (mini heatmap teaser) */
.mom-strip-wrap{margin-bottom:20px}
.mom-strip{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.mom-cell{width:13px;height:13px;border-radius:4px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border)}

.sec-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.sec-title h3{font-size:14.5px;font-weight:700}
.sec-title a{font-size:11.5px;color:var(--accent);font-weight:700}

/* ============================================================
   HABIT LIST ITEMS
   ============================================================ */
.hab-list{display:flex;flex-direction:column;gap:9px}
.hab-item{
  display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;transition:all .15s;position:relative;overflow:hidden;
}
.hab-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hc,var(--accent));opacity:.7}
.hab-icon{
  width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:var(--hc-soft,var(--accent-soft));flex-shrink:0;
}
.hab-info{flex:1;min-width:0}
.hab-name{font-size:13.5px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hab-meta{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:6px}
.hab-meta .flame{color:var(--warn)}
.hab-check{
  width:34px;height:34px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.hab-check svg{width:16px;height:16px;opacity:0;transition:opacity .12s}
.hab-item.done .hab-check{background:var(--ok);border-color:var(--ok)}
.hab-item.done .hab-check svg{opacity:1;color:#fff}
.hab-item.done{background:var(--ok-soft)}
.hab-item.missed .hab-check{background:var(--bad);border-color:var(--bad)}
.hab-item.missed .hab-check svg{opacity:1;color:#fff}
.hab-item.missed{background:var(--bad-soft)}
.hab-edit-btn{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-shrink:0}
.hab-edit-btn:hover{background:var(--surface2);color:var(--text)}
.hab-edit-btn svg{width:14px;height:14px}

/* ============================================================
   CALENDAR HEATMAP
   ============================================================ */
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cal-nav b{font-size:15px;font-weight:700;min-width:140px;text-align:center;font-family:var(--f-display)}
.cal-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
.cal-table{border-collapse:separate;border-spacing:0;width:100%}
.cal-table th{
  font-size:9px;color:var(--text3);font-weight:700;padding:8px 3px;text-align:center;
  position:sticky;top:0;background:var(--surface);z-index:2;
}
.cal-habit-col{
  text-align:left;padding:9px 12px;min-width:150px;position:sticky;left:0;z-index:3;background:var(--surface);
  border-right:1px solid var(--border);white-space:nowrap;
}
.cal-hname{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
.cal-hname .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-hmeta{font-size:9.5px;color:var(--text3);margin-top:2px;padding-left:15px}
.cal-cell{width:26px;height:26px;text-align:center;padding:2px;border-bottom:1px solid var(--border)}
.cal-dot{
  width:20px;height:20px;border-radius:6px;margin:0 auto;display:flex;align-items:center;justify-content:center;
  background:var(--surface2);cursor:pointer;transition:transform .1s;font-size:10px;
}
.cal-dot:hover{transform:scale(1.15)}
.cal-dot.future{cursor:default;opacity:.35}
.cal-dot.future:hover{transform:none}
.cal-dot.unsched{opacity:.25}
.cal-row:hover .cal-habit-col{background:var(--surface2)}
tr.cal-row:nth-child(odd) .cal-cell{background:rgba(128,128,128,.02)}

/* ============================================================
   STATS
   ============================================================ */
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar-track{width:100%;max-width:34px;height:100%;background:var(--surface2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.bar-fill{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:8px 8px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bar-lbl{font-size:9.5px;color:var(--text2);font-weight:700}

.spark-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.spark-row:last-child{border-bottom:none}
.spark-info{width:130px;flex-shrink:0;min-width:0}
.spark-info b{font-size:12.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark-info span{font-size:10.5px;color:var(--text2)}
.spark-cells{display:flex;gap:2.5px;flex:1;overflow:hidden}
.spark-cell{width:9px;height:22px;border-radius:2.5px;flex-shrink:0;background:var(--surface2)}
.spark-streak{font-family:var(--f-mono);font-size:13px;font-weight:600;width:52px;text-align:right;flex-shrink:0}

.rate-ring-sm{position:relative;width:56px;height:56px;flex-shrink:0}
.rate-ring-sm svg{transform:rotate(-90deg)}

/* ============================================================
   ACHIEVEMENTS
   ============================================================ */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.badge{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 14px;text-align:center;
  transition:all .2s;
}
.badge.earned{background:linear-gradient(160deg,var(--accent-soft),var(--surface));border-color:var(--accent)}
.badge-icon{
  width:52px;height:52px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;
  font-size:24px;margin:0 auto 10px;filter:grayscale(1);opacity:.4;
}
.badge.earned .badge-icon{filter:none;opacity:1;background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.badge-name{font-size:12px;font-weight:700;margin-bottom:3px}
.badge-desc{font-size:10px;color:var(--text2);line-height:1.4}

/* ============================================================
   TEMPLATES
   ============================================================ */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tpl-card{
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:13px;padding:11px 12px;transition:all .15s;text-align:left;
}
.tpl-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.tpl-icon{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tpl-name{font-size:12px;font-weight:700}
.tpl-freq{font-size:9.5px;color:var(--text2)}

/* ============================================================
   AI COACH CHAT
   ============================================================ */
#ai-fab{
  position:fixed;bottom:22px;right:22px;z-index:150;width:56px;height:56px;border-radius:18px;
  background:linear-gradient(150deg,var(--accent),var(--accent2));box-shadow:0 8px 24px var(--accent-soft),var(--shadow);
  display:flex;align-items:center;justify-content:center;transition:transform .2s;color:var(--accent-contrast);
}
#ai-fab:hover{transform:scale(1.06) rotate(-4deg)}
#ai-fab svg{width:24px;height:24px}
#ai-fab .fab-badge{
  position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--bad);
  border:2px solid var(--bg);display:none;
}
@media(max-width:880px){#ai-fab{bottom:82px;right:16px;width:50px;height:50px;border-radius:16px}}

#ai-panel{
  position:fixed;bottom:0;right:0;z-index:250;width:400px;max-width:100vw;height:min(640px,100vh);
  background:var(--bg2);border:1px solid var(--border);border-radius:22px 0 0 0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;transform:translateY(100%);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1);
}
#ai-panel.open{transform:translateY(0);opacity:1;pointer-events:auto}
@media(max-width:520px){#ai-panel{width:100%;height:100%;border-radius:0}}
.ai-head{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--border)}
.ai-head-icon{width:36px;height:36px;border-radius:11px;background:linear-gradient(150deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-head-icon svg{width:18px;height:18px;color:var(--accent-contrast)}
.ai-head-txt b{font-size:13.5px;font-weight:700;display:block;font-family:var(--f-display)}
.ai-head-txt span{font-size:10px;color:var(--text2);font-family:var(--f-mono);letter-spacing:.03em}
.ai-msgs{flex:1;overflow-y:auto;padding:16px 16px 6px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:12.5px;line-height:1.55}
.ai-msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-contrast);border-bottom-right-radius:4px}
.ai-msg.agent{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.ai-msg.system{align-self:center;background:transparent;color:var(--text2);font-size:11.5px;text-align:center;max-width:100%}
.ai-msg.tool{align-self:flex-start;background:var(--ok-soft);color:var(--ok);font-family:var(--f-mono);font-size:10.5px;border-bottom-left-radius:4px}
.ai-thinking{align-self:flex-start;display:flex;gap:4px;padding:12px}
.ai-thinking span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:aidot 1s infinite}
.ai-thinking span:nth-child(2){animation-delay:.15s}.ai-thinking span:nth-child(3){animation-delay:.3s}
@keyframes aidot{0%,80%,100%{opacity:.3;transform:scale(1)}40%{opacity:1;transform:scale(1.3)}}
.ai-suggest-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.ai-suggest{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:7px 12px;font-size:11px;font-weight:600;color:var(--text2)}
.ai-suggest:hover{border-color:var(--accent);color:var(--accent)}
.ai-input-row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);align-items:flex-end}
#ai-input{
  flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;padding:10px 13px;
  font-size:12.5px;max-height:100px;resize:none;outline:none;
}
#ai-input:focus{border-color:var(--accent)}
#ai-send{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-contrast);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#ai-send:disabled{opacity:.4}
#ai-send svg{width:16px;height:16px}

/* ============================================================
   SETTINGS
   ============================================================ */
.accent-row{display:flex;gap:10px;flex-wrap:wrap}
.accent-swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.accent-swatch:hover{transform:scale(1.1)}
.accent-swatch.sel{border-color:var(--text)}
.accent-swatch svg{width:15px;height:15px;color:#fff;opacity:0}
.accent-swatch.sel svg{opacity:1}
.theme-cards{display:flex;gap:12px}
.theme-card{flex:1;border-radius:14px;border:2px solid var(--border);padding:12px;cursor:pointer;transition:all .15s}
.theme-card.sel{border-color:var(--accent)}
.theme-card-prev{height:52px;border-radius:9px;margin-bottom:9px}
.theme-card b{font-size:12px;font-weight:700}
.week-row{display:flex;gap:8px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.avatar-big{width:60px;height:60px;border-radius:18px;background:linear-gradient(150deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--accent-contrast);flex-shrink:0}

.divider{height:1px;background:var(--border);margin:18px 0}
.flame-pulse{display:inline-block;animation:flamePulse 2.2s ease-in-out infinite}
@keyframes flamePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 37%,var(--surface2) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:8px}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

  display:flex;align-items:center;justify-content:center;padding:20px;

/* ---- storage layer: one Firestore doc per signed-in user, realtime-synced ---- */
function userDocRef(){

var _saveTimer = null;
function save(){
  if(!_currentUser) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function(){
    userDocRef().set({
      profile: S.profile,
      habits: S.habits,
      email: _currentUser.email || null,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true}).catch(function(err){
      console.error('save failed', err);
      toast('Could not save — check your connection', true);
    });
  }, 260);
}
function startRealtimeSync(){
  _firstSnapshot = true;
  _unsubDoc = userDocRef().onSnapshot(function(doc){
    if(doc.exists){
      var data = doc.data();
      if(data.profile) S.profile = Object.assign(S.profile, data.profile);
      if(Array.isArray(data.habits)) S.habits = data.habits;
    }
    if(_firstSnapshot){
      _firstSnapshot = false;
      if(!doc.exists) save();   // brand-new account — create its document
      initApp();
    } else if(!doc.metadata.hasPendingWrites){
      // a genuine remote update (another device/tab on the same account) —
      // our own local writes also fire this listener, so we skip those
      // (hasPendingWrites=true) to avoid re-rendering mid-keystroke.
      applyTheme(); renderNav(); reRenderCurrent();
    }
  }, function(err){
    console.error('sync error', err);
    toast('Sync error: ' + err.message, true);
  });
}
function stopRealtimeSync(){
  if(_unsubDoc){ _unsubDoc(); _unsubDoc = null; }
}

/* ==================================================================

   ================================================================== */
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function dateStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseDate(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2],12,0,0); }
function today(){ return _todayStr; }
function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }
function isFuture(dStr){ return dStr > _todayStr; }
function isToday(dStr){ return dStr === _todayStr; }
function monthLabel(ym){ var p=ym.split('-'); var d=new Date(p[0],p[1]-1,1); return d.toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
function weekdayShort(dStr){ return DAY_LABELS_FULL[parseDate(dStr).getDay()]; }
function fmtTime(hhmm){
  if(!hhmm) return '';
  var p = hhmm.split(':'); var h = parseInt(p[0],10), m = p[1];
  var ap = h>=12 ? 'PM' : 'AM'; var h12 = h%12; if(h12===0) h12=12;
  return h12+':'+m+' '+ap;
}
function niceDate(dStr){ return parseDate(dStr).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); }
function uid(){ return 'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function pct(n){ return Math.round(n*100); }

/* week key using S.profile.weekStart (0=Sun,1=Mon) */
function weekStartDate(dStr){
  var d = parseDate(dStr);
  var ws = S.profile.weekStart;
  var diff = (d.getDay() - ws + 7) % 7;
  return addDays(d,-diff);
}
function weekKey(dStr){ return dateStr(weekStartDate(dStr)); }

/* ==================================================================
   HABIT DOMAIN LOGIC
   ================================================================== */
function activeHabits(){ return S.habits.filter(function(h){ return !h.archived; }); }
function habitById(id){ return S.habits.find(function(h){ return h.id===id; }); }

function isScheduledOn(h, dStr){
  if(dStr < h.createdAt) return false;
  if(h.freqType==='days') return (h.freqDays||[]).indexOf(parseDate(dStr).getDay()) !== -1;
  return true; // daily + weekly-count are eligible every day
}
function getStatus(h,dStr){ return h.logs[dStr] || null; }
function setStatus(hId,dStr,status){
  var h = habitById(hId); if(!h) return;
  if(status) h.logs[dStr] = status; else delete h.logs[dStr];
  save();
}
/* cycles: unset -> done -> missed -> unset */
function cycleStatus(hId,dStr){
  var h = habitById(hId); if(!h || isFuture(dStr)) return;
  var cur = getStatus(h,dStr);
  var next = cur===null ? 'done' : (cur==='done' ? 'missed' : null);
  setStatus(hId,dStr,next);
}

function scheduledDaysInRange(h,fromStr,toStr){
  var out=[]; var d=parseDate(fromStr); var end=parseDate(toStr);
  while(d<=end){ var ds=dateStr(d); if(isScheduledOn(h,ds)) out.push(ds); d=addDays(d,1); }
  return out;
}

/* current streak (days), handles daily/days habits */
function currentStreakDayBased(h){
  var d = parseDate(_todayStr); var streak=0; var first=true;
  while(true){
    var ds = dateStr(d);
    if(ds < h.createdAt) break;
    if(!isScheduledOn(h,ds)){ d=addDays(d,-1); continue; }
    var st = getStatus(h,ds);
    if(ds===_todayStr && st===null){ d=addDays(d,-1); continue; } // today pending, don't break yet
    if(st==='done'){ streak++; d=addDays(d,-1); continue; }
    break;
  }
  return streak;
}
function bestStreakDayBased(h){
  var days = scheduledDaysInRange(h,h.createdAt,_todayStr);
  var best=0,run=0;
  days.forEach(function(ds){
    if(getStatus(h,ds)==='done'){ run++; best=Math.max(best,run); } else { run=0; }
  });
  return best;
}
/* week-based streak for 'weekly' (X times/week) habits */
function weekCompletionCount(h,wkStart){
  var cnt=0; var d=new Date(wkStart);
  for(var i=0;i<7;i++){ var ds=dateStr(d); if(ds<=_todayStr && getStatus(h,ds)==='done') cnt++; d=addDays(d,1); }
  return cnt;
}
function currentStreakWeekBased(h){
  var wk = weekStartDate(_todayStr); var streak=0; var first=true;
  while(true){
    var wkStr = dateStr(wk);
    if(addDays(wk,6) < parseDate(h.createdAt)) break;
    var cnt = weekCompletionCount(h,wk);
    var met = cnt >= (h.freqCount||1);
    if(first){ first=false; if(!met){ wk=addDays(wk,-7); continue; } } // current week in progress: skip if not yet met
    if(met){ streak++; wk=addDays(wk,-7); continue; }
    break;
  }
  return streak;
}
function bestStreakWeekBased(h){
  var wk = weekStartDate(h.createdAt); var end = weekStartDate(_todayStr);
  var best=0,run=0;
  while(wk<=end){
    var cnt = weekCompletionCount(h,wk);
    if(cnt >= (h.freqCount||1)){ run++; best=Math.max(best,run); } else { run=0; }
    wk = addDays(wk,7);
  }
  return best;
}
function currentStreak(h){ return h.freqType==='weekly' ? currentStreakWeekBased(h) : currentStreakDayBased(h); }
function bestStreak(h){ return h.freqType==='weekly' ? bestStreakWeekBased(h) : bestStreakDayBased(h); }

function totalCompletions(h){
  var n=0; for(var k in h.logs){ if(h.logs[k]==='done') n++; } return n;
}
function totalCompletionsAll(){ return activeHabits().reduce(function(s,h){ return s+totalCompletions(h); },0); }
function bestStreakGlobal(){ return activeHabits().reduce(function(m,h){ return Math.max(m,bestStreak(h)); },0); }

/* today's aggregate stats across active, scheduled habits */
function todayStats(){
  var list = activeHabits().filter(function(h){ return isScheduledOn(h,_todayStr); });
  var done = list.filter(function(h){ return getStatus(h,_todayStr)==='done'; }).length;
  return {done:done, total:list.length, pct: list.length ? done/list.length : 0};
}
function dayCompletionPct(dStr){
  var list = activeHabits().filter(function(h){ return isScheduledOn(h,dStr) && dStr>=h.createdAt; });
  if(!list.length) return null;
  var done = list.filter(function(h){ return getStatus(h,dStr)==='done'; }).length;
  return done/list.length;
}
/* is a given week (by key) a "perfect week" - 100% completion on every day that had scheduled habits */
function isPerfectWeek(wkStartStr){
  var d = parseDate(wkStartStr); var any=false;
  for(var i=0;i<7;i++){
    var ds=dateStr(d);
    if(ds<=_todayStr){
      var p = dayCompletionPct(ds);
      if(p!==null){ any=true; if(p<1) return false; }
    }
    d=addDays(d,1);
  }
  return any;
}
function perfectWeeksCount(){
  if(!S.habits.length) return 0;
  var earliest = S.habits.reduce(function(m,h){ return h.createdAt<m?h.createdAt:m; }, _todayStr);
  var wk = weekStartDate(earliest); var end = weekStartDate(_todayStr); var n=0;
  while(wk<=end){ if(isPerfectWeek(dateStr(wk))) n++; wk=addDays(wk,7); }
  return n;
}
function isBadgeEarned(b){
  if(b.type==='streak') return bestStreakGlobal() >= b.n;
  if(b.type==='completions') return totalCompletionsAll() >= b.n;
  if(b.type==='perfectweek') return perfectWeeksCount() >= b.n;
  if(b.type==='habitcount') return activeHabits().length >= b.n;
  return false;
}

function ringSVG(fraction, size, stroke){
  var r = (size-stroke)/2, c = 2*Math.PI*r;
  var off = c*(1-clamp(fraction,0,1));
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle class="ring-track" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-width="'+stroke+'"/>'+
    '<circle class="ring-fill" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-width="'+stroke+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>'+
    '</svg>';
}

function greetingText(){
  var h = new Date().getHours();
  if(h<5) return 'Still up?';
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  if(h<21) return 'Good evening';
  return 'Good night';
}
function momentumHeadline(ts){
  if(ts.total===0) return 'Add a habit to get your day started.';
  if(ts.pct>=1) return 'Perfect day — every habit checked off.';
  if(ts.pct===0) return (ts.total-ts.done)+' habit'+(ts.total===1?'':'s')+' waiting on you today.';
  return 'You\'re '+ts.done+' of '+ts.total+' done — keep the streak alive.';
}
function statCard(val,lbl){ return '<div class="stat-card"><b class="mono">'+val+'</b><span>'+lbl+'</span></div>'; }
function last30Rate(){
  var d=addDays(parseDate(_todayStr),-29); var sum=0,n=0;
  for(var i=0;i<30;i++){ var ds=dateStr(d); var p=dayCompletionPct(ds); if(p!==null){ sum+=p; n++; } d=addDays(d,1); }
  return n ? sum/n : 0;
}
function momentumStripHTML(days){
  var d = addDays(parseDate(_todayStr), -(days-1)); var cells='';
  for(var i=0;i<days;i++){
    var ds=dateStr(d); var p=dayCompletionPct(ds);
    var bg = p===null ? 'var(--surface2)' : intensityColor(p);
    cells += '<div class="mom-cell" title="'+ds+(p!==null?' · '+pct(p)+'%':'')+'" style="background:'+bg+'"></div>';
    d=addDays(d,1);
  }
  return '<div class="mom-strip">'+cells+'</div>';
}
function intensityColor(p){
  if(p<=0) return 'var(--bad-soft)';
  if(p<.5) return 'color-mix(in srgb, var(--accent) 35%, var(--surface2))';
  if(p<1) return 'color-mix(in srgb, var(--accent) 65%, var(--surface2))';
  return 'var(--accent)';
}
function emptyState(title,desc,onclick,btnLabel){
  return '<div class="empty">'+
    '<div class="empty-icon">'+ICONS.sparkle+'</div>'+
    '<h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p>'+
    (onclick?'<button class="btn primary" onclick="'+onclick+'">'+ICONS.plus+' '+esc(btnLabel)+'</button>':'')+
  '</div>';
}

/* ==================================================================
   SHARED HABIT ITEM (used on Dashboard + Today)
   ================================================================== */
function freqLabel(h){
  if(h.freqType==='daily') return 'Every day';
  if(h.freqType==='weekly') return h.freqCount+'x per week';
  var days=(h.freqDays||[]).slice().sort();
  if(days.length===7) return 'Every day';
  return days.map(function(d){ return DAY_LABELS_FULL[d].slice(0,3); }).join(' · ');
}
function habitItemHTML(h){
  var st = getStatus(h,_todayStr);
  var streak = currentStreak(h);
  var cls = st==='done' ? 'done' : (st==='missed' ? 'missed' : '');
  var checkIcon = st==='done' ? ICONS.check : (st==='missed' ? ICONS.x : '');
  return '<div class="hab-item '+cls+'" style="--hc:'+h.color+';--hc-soft:'+h.color+'26">'+
    '<div class="hab-icon" style="background:'+h.color+'26">'+h.icon+'</div>'+
    '<div class="hab-info"><div class="hab-name">'+esc(h.name)+'</div>'+
      '<div class="hab-meta">'+(streak>0?'<span class="flame">🔥 '+streak+'</span> · ':'')+esc(freqLabel(h))+(h.reminder?' · ⏰ '+fmtTime(h.reminder):'')+'</div></div>'+
    '<button class="hab-edit-btn" onclick="event.stopPropagation();openHabitModal(\''+h.id+'\')" title="Edit">'+ICONS.edit+'</button>'+
    '<button class="hab-check" onclick="event.stopPropagation();cycleStatus(\''+h.id+'\',\''+_todayStr+'\');reRenderCurrent()" title="Tap to mark done, tap again to mark missed">'+checkIcon+'</button>'+
  '</div>';
}
function reRenderCurrent(){
  if(_curPage==='dashboard') renderDashboard();
  else if(_curPage==='today') renderToday();
  else if(_curPage==='stats') renderStats();
  else if(_curPage==='calendar') renderCalendar();
  updateSideRing();
  renderNav();
}
function updateSideRing(){
  var ts = todayStats();
  var ringEl = document.getElementById('sideRing');
  if(ringEl) ringEl.innerHTML = ringSVG(ts.pct,56,7);
  var pctEl = document.getElementById('sideRingPct');
  if(pctEl) pctEl.textContent = pct(ts.pct)+'%';
}

function renderToday(){
  var el = document.getElementById('page-today');
  var all = activeHabits().filter(function(h){ return isScheduledOn(h,_todayStr); });
  var pending = all.filter(function(h){ return getStatus(h,_todayStr)===null; });
  var done = all.filter(function(h){ return getStatus(h,_todayStr)==='done'; });
  var missed = all.filter(function(h){ return getStatus(h,_todayStr)==='missed'; });

  var html = '<div class="page-head"><div><div class="page-title">Today</div><div class="page-sub">'+niceDate(_todayStr)+' · '+done.length+'/'+all.length+' done</div></div>'+
    '<div class="page-actions"><button class="btn primary" onclick="openHabitModal()">'+ICONS.plus+' New Habit</button></div></div>';

  if(!S.habits.length){
    html += emptyState('No habits yet','Start with a template below, or create your own from scratch.','openHabitModal()','New Habit');
    html += templateSectionHTML();
  } else if(!all.length){
    html += emptyState('Nothing scheduled today','Enjoy the rest, or add a habit for today.','openHabitModal()','New Habit');
  } else {
    if(pending.length) html += '<div class="sec-title" style="margin-top:0"><h3>To do — '+pending.length+'</h3></div><div class="hab-list">'+pending.map(habitItemHTML).join('')+'</div>';
    if(done.length) html += '<div class="sec-title"><h3>Done — '+done.length+'</h3></div><div class="hab-list">'+done.map(habitItemHTML).join('')+'</div>';
    if(missed.length) html += '<div class="sec-title"><h3>Missed — '+missed.length+'</h3></div><div class="hab-list">'+missed.map(habitItemHTML).join('')+'</div>';
  }

  var archived = S.habits.filter(function(h){ return h.archived; });
  if(archived.length){
    html += '<div class="sec-title"><h3>Archived</h3></div><div class="hab-list">'+archived.map(function(h){
      return '<div class="hab-item" style="--hc:'+h.color+';--hc-soft:'+h.color+'26;opacity:.55">'+
        '<div class="hab-icon" style="background:'+h.color+'26">'+h.icon+'</div>'+
        '<div class="hab-info"><div class="hab-name">'+esc(h.name)+'</div><div class="hab-meta">Archived</div></div>'+
        '<button class="hab-edit-btn" onclick="openHabitModal(\''+h.id+'\')" title="Edit">'+ICONS.edit+'</button>'+
      '</div>';
    }).join('')+'</div>';
  }

  el.innerHTML = html;
  updateSideRing();
}

   ================================================================== */
function calNav(dir){
  var d = new Date(_calMonth+'-01T12:00:00');
  d.setMonth(d.getMonth()+dir);
  _calMonth = d.getFullYear()+'-'+pad2(d.getMonth()+1);
  renderCalendar();
}
function renderCalendar(){
  if(!_calMonth) _calMonth = _todayStr.slice(0,7);
  var el = document.getElementById('page-calendar');
  var html = '<div class="page-head"><div><div class="page-title">Calendar</div><div class="page-sub">Monthly consistency tracker</div></div>'+
    '<div class="page-actions"><button class="btn primary" onclick="openHabitModal()">'+ICONS.plus+' New Habit</button></div></div>';
  html += '<div class="cal-nav"><button class="btn icon-only" onclick="calNav(-1)">'+ICONS.chevL+'</button><b>'+monthLabel(_calMonth)+'</b><button class="btn icon-only" onclick="calNav(1)">'+ICONS.chevR+'</button>'+
    '<button class="btn sm ghost" style="margin-left:auto" onclick="_calMonth=_todayStr.slice(0,7);renderCalendar()">Today</button></div>';

  var list = activeHabits();
  if(!list.length){
    html += emptyState('No habits to show','Add a habit to see it appear on the calendar.','openHabitModal()','New Habit');
    el.innerHTML = html; return;
  }

  var p = _calMonth.split('-').map(Number);
  var yr=p[0], mo=p[1];
  var daysInMonth = new Date(yr,mo,0).getDate();
  var monthStart = yr+'-'+pad2(mo)+'-01';
  var monthEnd = yr+'-'+pad2(mo)+'-'+pad2(daysInMonth);

  html += '<div class="cal-scroll"><table class="cal-table"><thead><tr><th class="cal-habit-col" style="position:sticky;left:0;top:0;z-index:4">HABIT</th>';
  for(var i=1;i<=daysInMonth;i++){
    var ds = yr+'-'+pad2(mo)+'-'+pad2(i);
    var isTod = ds===_todayStr;
    html += '<th style="'+(isTod?'color:var(--accent)':'')+'">'+DAY_LABELS[new Date(yr,mo-1,i).getDay()]+'<br>'+i+'</th>';
  }
  html += '</tr></thead><tbody>';

  list.forEach(function(h){
    html += '<tr class="cal-row"><td class="cal-habit-col"><div class="cal-hname"><span class="dot" style="background:'+h.color+'"></span>'+h.icon+' '+esc(h.name)+'</div>'+
      '<div class="cal-hmeta">'+(currentStreak(h)>0?'🔥 '+currentStreak(h)+' · ':'')+esc(freqLabel(h))+'</div></td>';
    for(var i=1;i<=daysInMonth;i++){
      var ds = yr+'-'+pad2(mo)+'-'+pad2(i);
      var future = isFuture(ds);
      var sched = isScheduledOn(h,ds) && ds>=h.createdAt;
      var st = getStatus(h,ds);
      var dot='', cls='cal-dot'+(future?' future':'')+((!sched)?' unsched':'');
      if(sched && st==='done') dot = '<div class="'+cls+'" style="background:var(--ok)" onclick="cycleStatus(\''+h.id+'\',\''+ds+'\');reRenderCurrent()">'+ICONS.check+'</div>';
      else if(sched && st==='missed') dot = '<div class="'+cls+'" style="background:var(--bad)" onclick="cycleStatus(\''+h.id+'\',\''+ds+'\');reRenderCurrent()">'+ICONS.x+'</div>';
      else if(sched) dot = '<div class="'+cls+'" onclick="cycleStatus(\''+h.id+'\',\''+ds+'\');reRenderCurrent()"></div>';
      else dot = '<div class="'+cls+'"></div>';
      html += '<td class="cal-cell">'+dot+'</td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="hint" style="margin-top:10px">Tap a cell to mark done, tap again for missed, tap again to clear.</div>';

  el.innerHTML = html;
}

function renderStats(){
  var el = document.getElementById('page-stats');
  var list = activeHabits();
  var html = '<div class="page-head"><div><div class="page-title">Stats & Progress</div><div class="page-sub">How consistent you\'ve really been</div></div></div>';

  if(!list.length){ html += emptyState('No data yet','Add a habit and start checking in to see your stats.','openHabitModal()','New Habit'); el.innerHTML=html; return; }

  html += '<div class="stat-grid">'+
    statCard(list.length,'Active habits')+
    statCard(bestStreakGlobal(),'Longest streak')+
    statCard(totalCompletionsAll(),'Total check-ins')+
    statCard(pct(last30Rate())+'%','30-day rate')+
  '</div>';

  html += '<div class="card" style="margin-bottom:20px"><div class="sec-title" style="margin-top:0"><h3>Last 7 days</h3></div>'+weekBarChartHTML()+'</div>';

  html += '<div class="sec-title" style="margin-top:0"><h3>Per-habit streaks</h3></div><div class="card">'+
    list.map(function(h){
      var streak = currentStreak(h);
      return '<div class="spark-row">'+
        '<div class="spark-info"><b>'+h.icon+' '+esc(h.name)+'</b><span>'+esc(freqLabel(h))+'</span></div>'+
        '<div class="spark-cells">'+sparkCellsHTML(h,21)+'</div>'+
        '<div class="spark-streak mono" style="color:'+(streak>0?'var(--warn)':'var(--text3)')+'">'+(streak>0?'🔥'+streak:'—')+'</div>'+
      '</div>';
    }).join('')+
  '</div>';

  el.innerHTML = html;
}
function weekBarChartHTML(){
  var d = addDays(parseDate(_todayStr),-6); var cols='';
  for(var i=0;i<7;i++){
    var ds=dateStr(d); var p=dayCompletionPct(ds); var h=p===null?0:Math.round(p*100);
    cols += '<div class="bar-col"><div class="bar-track"><div class="bar-fill" style="height:'+h+'%"></div></div><div class="bar-lbl">'+DAY_LABELS[d.getDay()]+'</div></div>';
    d=addDays(d,1);
  }
  return '<div class="bar-chart">'+cols+'</div>';
}
function sparkCellsHTML(h,n){
  var d = addDays(parseDate(_todayStr),-(n-1)); var cells='';
  for(var i=0;i<n;i++){
    var ds=dateStr(d); var sched=isScheduledOn(h,ds)&&ds>=h.createdAt; var st=getStatus(h,ds);
    var bg='var(--surface2)';
    if(isFuture(ds)||!sched) bg='var(--surface2)';
    else if(st==='done') bg='var(--ok)';
    else if(st==='missed') bg='var(--bad)';
    else bg='var(--border2)';
    cells += '<div class="spark-cell" title="'+ds+'" style="background:'+bg+(isToday(ds)?';box-shadow:0 0 0 1.5px var(--accent)':'')+'"></div>';
    d=addDays(d,1);
  }
  return cells;
}

function manageHabitRowHTML(h){
  return '<div class="hab-item" style="--hc:'+h.color+';--hc-soft:'+h.color+'26'+(h.archived?';opacity:.5':'')+'">'+
    '<div class="hab-icon" style="background:'+h.color+'26">'+h.icon+'</div>'+
    '<div class="hab-info"><div class="hab-name">'+esc(h.name)+'</div><div class="hab-meta">'+esc(h.cat)+' · '+esc(freqLabel(h))+(h.reminder?' · ⏰ '+fmtTime(h.reminder):'')+(h.archived?' · Archived':'')+'</div></div>'+
    '<button class="hab-edit-btn" onclick="openHabitModal(\''+h.id+'\')" title="Edit">'+ICONS.edit+'</button>'+
  '</div>';
}
function toggleNotif(){
  if(!S.profile.notif){
    if('Notification' in window){
      Notification.requestPermission().then(function(perm){
        S.profile.notif = (perm==='granted'); save(); renderSettings();
        toast(perm==='granted' ? 'Reminders enabled' : 'Permission not granted', perm!=='granted');
      });
      return;
    } else { toast('Notifications not supported in this browser', true); return; }
  }
  S.profile.notif = false; save(); renderSettings();
}
function exportData(){
  var blob = new Blob([JSON.stringify({profile:S.profile, habits:S.habits, exportedAt:_todayStr},null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'habitos-backup-'+_todayStr+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Backup downloaded');
}
function importData(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(!Array.isArray(data.habits)) throw new Error('bad format');
      S.habits = data.habits;
      if(data.profile) S.profile = Object.assign(S.profile, data.profile);
      save(); applyTheme(); go(_curPage);
      toast('Backup imported');
    }catch(err){ toast('Could not read that file', true); }
  };
  reader.readAsText(file);
}
function resetData(){
  if(!confirm('This deletes every habit and log permanently. Continue?')) return;
  S.habits = [];
  S.profile = {name:S.profile.name, theme:S.profile.theme, accent:S.profile.accent, weekStart:S.profile.weekStart, notif:false};
  save(); go('dashboard');
  toast('All data cleared');
}

/* ==================================================================
   ADD / EDIT HABIT MODAL
   ================================================================== */
var _editingId = null;
var _formIcon='🎯', _formColor=HABIT_COLORS[0], _formFreqType='daily', _formFreqDays=[1,2,3,4,5], _formFreqCount=3;

function openHabitModal(id){
  _editingId = id || null;
  var h = id ? habitById(id) : null;
  _formIcon = h ? h.icon : EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  _formColor = h ? h.color : HABIT_COLORS[S.habits.length % HABIT_COLORS.length];
  _formFreqType = h ? h.freqType : 'daily';
  _formFreqDays = h ? (h.freqDays||[1,2,3,4,5]).slice() : [1,2,3,4,5];
  _formFreqCount = h ? (h.freqCount||3) : 3;

  document.getElementById('habitModal').innerHTML = habitFormHTML(h);
  document.getElementById('habitVeil').classList.add('open');
  setTimeout(function(){ var i=document.getElementById('hf-name'); if(i) i.focus(); }, 60);
}
function closeHabitModal(){ document.getElementById('habitVeil').classList.remove('open'); }

function habitFormHTML(h){
  var isEdit = !!h;
  var out = '<div class="modal-head"><div class="modal-title">'+(isEdit?'Edit Habit':'New Habit')+'</div>'+
    '<button class="icon-btn" onclick="closeHabitModal()">'+ICONS.x+'</button></div>';

  out += '<div class="field"><span class="field-label">Name</span><input class="inp" id="hf-name" placeholder="e.g. Morning Walk" value="'+(h?esc(h.name):'')+'"/></div>';

  out += '<div class="field"><span class="field-label">Icon</span><div class="emoji-grid" id="hf-emoji-grid">'+
    EMOJIS.map(function(e){ return '<div class="emoji-opt'+(e===_formIcon?' sel':'')+'" onclick="pickIcon(this,\''+e+'\')">'+e+'</div>'; }).join('')+
  '</div></div>';

  out += '<div class="field"><span class="field-label">Color</span><div class="swatch-row" id="hf-color-row">'+
    HABIT_COLORS.map(function(c){ return '<div class="swatch'+(c===_formColor?' sel':'')+'" style="background:'+c+'" onclick="pickColor(this,\''+c+'\')">'+ICONS.check+'</div>'; }).join('')+
  '</div></div>';

  out += '<div class="field-row"><div class="field"><span class="field-label">Category</span><select class="sel" id="hf-cat">'+
    CATEGORIES.map(function(c){ return '<option'+(h&&h.cat===c?' selected':'')+'>'+c+'</option>'; }).join('')+
  '</select></div>'+
  '<div class="field"><span class="field-label">Reminder (optional)</span><input class="inp" type="time" id="hf-reminder" value="'+(h&&h.reminder?h.reminder:'')+'"/></div></div>';

  out += '<div class="field"><span class="field-label">Frequency</span>'+
    '<div class="seg" id="hf-freq-seg">'+
      '<div class="seg-opt'+(_formFreqType==='daily'?' on':'')+'" onclick="pickFreqType(\'daily\',this)">Every day</div>'+
      '<div class="seg-opt'+(_formFreqType==='days'?' on':'')+'" onclick="pickFreqType(\'days\',this)">Custom days</div>'+
      '<div class="seg-opt'+(_formFreqType==='weekly'?' on':'')+'" onclick="pickFreqType(\'weekly\',this)">X / week</div>'+
    '</div>'+
    '<div id="hf-freq-detail" style="margin-top:12px">'+freqDetailHTML()+'</div>'+
  '</div>';

  out += '<div class="modal-foot">';
  if(isEdit){
    out += '<button class="btn danger icon-only" onclick="deleteHabitConfirm(\''+h.id+'\')" title="Delete">'+ICONS.trash+'</button>';
    out += '<button class="btn" onclick="toggleArchive(\''+h.id+'\')">'+(h.archived?'Unarchive':'Archive')+'</button>';
  }
  out += '<button class="btn primary block" onclick="saveHabitForm()">'+ICONS.check+' '+(isEdit?'Save changes':'Create habit')+'</button>';
  out += '</div>';
  return out;
}
function freqDetailHTML(){
  if(_formFreqType==='days'){
    return '<div class="day-picker">'+DAY_LABELS.map(function(l,i){
      return '<div class="day-opt'+(_formFreqDays.indexOf(i)!==-1?' on':'')+'" onclick="toggleFreqDay('+i+')">'+l+'</div>';
    }).join('')+'</div>';
  }
  if(_formFreqType==='weekly'){
    return '<div class="field" style="margin:0;max-width:160px"><span class="field-label">Times per week</span>'+
      '<input class="inp" type="number" min="1" max="7" id="hf-freqcount" value="'+_formFreqCount+'" oninput="_formFreqCount=clamp(parseInt(this.value)||1,1,7)"/></div>';
  }
  return '<div class="hint">Scheduled every single day.</div>';
}
function pickIcon(el,e){ _formIcon=e; document.querySelectorAll('#hf-emoji-grid .emoji-opt').forEach(function(x){x.classList.remove('sel');}); el.classList.add('sel'); }
function pickColor(el,c){ _formColor=c; document.querySelectorAll('#hf-color-row .swatch').forEach(function(x){x.classList.remove('sel');}); el.classList.add('sel'); }
function pickFreqType(t,el){
  _formFreqType=t;
  document.querySelectorAll('#hf-freq-seg .seg-opt').forEach(function(x){x.classList.remove('on');});
  el.classList.add('on');
  document.getElementById('hf-freq-detail').innerHTML = freqDetailHTML();
}
function toggleFreqDay(i){
  var idx=_formFreqDays.indexOf(i);
  if(idx===-1) _formFreqDays.push(i); else _formFreqDays.splice(idx,1);
  document.getElementById('hf-freq-detail').innerHTML = freqDetailHTML();
}
function saveHabitForm(){
  var name = document.getElementById('hf-name').value.trim();
  if(!name){ toast('Give your habit a name', true); return; }
  if(_formFreqType==='days' && !_formFreqDays.length){ toast('Pick at least one day', true); return; }
  var cat = document.getElementById('hf-cat').value;
  var reminder = document.getElementById('hf-reminder').value || null;

  if(_editingId){
    var h = habitById(_editingId);
    h.name=name; h.icon=_formIcon; h.color=_formColor; h.cat=cat; h.reminder=reminder;
    h.freqType=_formFreqType; h.freqDays=_formFreqDays.slice(); h.freqCount=_formFreqCount;
    toast('Habit updated');
  } else {
    S.habits.push({
      id:uid(), name:name, icon:_formIcon, color:_formColor, cat:cat, reminder:reminder,
      freqType:_formFreqType, freqDays:_formFreqDays.slice(), freqCount:_formFreqCount,
      createdAt:_todayStr, logs:{}, archived:false
    });
    toast('Habit created');
  }
  save(); closeHabitModal(); go(_curPage);
}
function deleteHabitConfirm(id){
  var h = habitById(id); if(!h) return;
  if(!confirm('Delete "'+h.name+'" and all of its history? This can\'t be undone.')) return;
  S.habits = S.habits.filter(function(x){ return x.id!==id; });
  save(); closeHabitModal(); go(_curPage);
  toast('Habit deleted');
}
function toggleArchive(id){
  var h = habitById(id); if(!h) return;
  h.archived = !h.archived; save(); closeHabitModal(); go(_curPage);
  toast(h.archived ? 'Habit archived' : 'Habit restored');
}

/* ==================================================================
   AI HABIT COACH  (uses the built-in Claude API — no key needed)

var _aiOpen = false;
var _aiHistory = [];
var _aiBusy = false;
var AI_SUGGESTIONS = ["How am I doing this week?","Add a habit for better sleep","What should I focus on today?","Suggest a new habit to try"];

function toggleAI(){
  _aiOpen = !_aiOpen;

function aiInit(){

function aiAutoGrow(el){ el.style.height=''; el.style.height=Math.min(el.scrollHeight,100)+'px'; }

}
function aiHideThinking(){ var el=document.getElementById('ai-thinking-el'); if(el) el.remove(); }

var AI_TOOLS = [
  { name:'add_habit', description:'Create a new habit for the user to track.',
    input_schema:{ type:'object', properties:{
      name:{type:'string', description:'Short name of the habit'},
      icon:{type:'string', description:'A single emoji representing the habit'},
      category:{type:'string', enum:CATEGORIES},
      frequency_type:{type:'string', enum:['daily','days','weekly'], description:'daily = every day, days = specific weekdays, weekly = X times per week on any days'},
      frequency_days:{type:'array', items:{type:'integer', minimum:0, maximum:6}, description:'Weekdays for frequency_type=days, 0=Sunday..6=Saturday'},
      frequency_count:{type:'integer', minimum:1, maximum:7, description:'Times per week for frequency_type=weekly'}
    }, required:['name'] } },
  { name:'log_habit', description:"Mark a habit done, missed, or clear its status for a given date (defaults to today). Use fuzzy matching on the habit name.",
    input_schema:{ type:'object', properties:{
      name:{type:'string', description:'Habit name (or part of it) to match'},
      status:{type:'string', enum:['done','missed','clear']},
      date:{type:'string', description:'YYYY-MM-DD, defaults to today if omitted'}
    }, required:['name','status'] } },
  { name:'list_habits', description:"List all of the user's habits with their schedule, current streak, and today's status.",
    input_schema:{ type:'object', properties:{} } },
  { name:'get_stats', description:'Get aggregate stats: today\'s completion, best streak, total check-ins, 30-day rate, badges earned.',
    input_schema:{ type:'object', properties:{} } },
  { name:'delete_habit', description:'Permanently delete a habit by name (fuzzy match).',
    input_schema:{ type:'object', properties:{ name:{type:'string'} }, required:['name'] } },
  { name:'archive_habit', description:'Archive or unarchive a habit by name (fuzzy match), removing/restoring it from active tracking without deleting history.',
    input_schema:{ type:'object', properties:{ name:{type:'string'}, archived:{type:'boolean'} }, required:['name','archived'] } }
];

/* ==================================================================
   GEMINI — Habit Coach runs on Google's Gemini API (client-side call).
   Get/rotate your key at https://aistudio.google.com/apikey
   NOTE: shipping an API key inside client-side HTML/JS means anyone who
   views source can read and reuse it. Fine for a personal/local build;
   for anything public-facing, proxy this call through a small backend
   instead so the key never reaches the browser.
   ================================================================== */
var GEMINI_API_KEY = "AQ.Ab8RN6K_5T9iKoJL-7_nLh9nZrduQMqYL7q5jaz1z-R1x8n2mg";
var GEMINI_MODEL = "gemini-2.5-flash";
var GEMINI_TOOLS = [{ functionDeclarations: AI_TOOLS.map(function(t){
  return { name:t.name, description:t.description, parameters:t.input_schema };
}) }];

function findHabitFuzzy(name){
  if(!name) return null;
  var nl = name.toLowerCase();
  return S.habits.find(function(h){ return h.name.toLowerCase()===nl; }) ||
         S.habits.find(function(h){ return h.name.toLowerCase().indexOf(nl)!==-1 || nl.indexOf(h.name.toLowerCase())!==-1; }) || null;
}
function aiExecuteTool(name,input){
  try{
    if(name==='add_habit'){
      if(!input.name) return {error:'name is required'};
      var ft = ['daily','days','weekly'].indexOf(input.frequency_type)!==-1 ? input.frequency_type : 'daily';
      var h = {
        id:uid(), name:input.name, icon:input.icon||EMOJIS[Math.floor(Math.random()*EMOJIS.length)],
        color:HABIT_COLORS[S.habits.length % HABIT_COLORS.length],
        cat: CATEGORIES.indexOf(input.category)!==-1 ? input.category : 'Other',
        freqType:ft, freqDays: Array.isArray(input.frequency_days)&&input.frequency_days.length?input.frequency_days:[1,2,3,4,5],
        freqCount: input.frequency_count||3, reminder:null, createdAt:_todayStr, logs:{}, archived:false
      };
      S.habits.push(h); save(); reRenderCurrent(); renderNav();
      return {ok:true, created:h.name, id:h.id};
    }
    if(name==='log_habit'){
      var h = findHabitFuzzy(input.name);
      if(!h) return {error:'No habit matching "'+input.name+'"'};
      var ds = input.date || _todayStr;
      var status = input.status==='done' ? 'done' : (input.status==='missed' ? 'missed' : null);
      setStatus(h.id,ds,status); reRenderCurrent(); renderNav();
      return {ok:true, habit:h.name, date:ds, status:input.status};
    }
    if(name==='list_habits'){
      return S.habits.map(function(h){
        return { name:h.name, category:h.cat, schedule:freqLabel(h), archived:!!h.archived,
          currentStreak: currentStreak(h), bestStreak: bestStreak(h), todayStatus: getStatus(h,_todayStr)||'pending',
          scheduledToday: isScheduledOn(h,_todayStr) };
      });
    }
    if(name==='get_stats'){
      var ts = todayStats();
      return { todayDone:ts.done, todayTotal:ts.total, todayPct:pct(ts.pct),
        bestStreakEver:bestStreakGlobal(), totalCheckIns:totalCompletionsAll(),
        last30DayRate:pct(last30Rate()), badgesEarned:BADGES.filter(isBadgeEarned).length, badgesTotal:BADGES.length,
        activeHabits:activeHabits().length };
    }
    if(name==='delete_habit'){
      var h = findHabitFuzzy(input.name);
      if(!h) return {error:'No habit matching "'+input.name+'"'};
      S.habits = S.habits.filter(function(x){ return x.id!==h.id; }); save(); reRenderCurrent(); renderNav();
      return {ok:true, deleted:h.name};
    }
    if(name==='archive_habit'){
      var h = findHabitFuzzy(input.name);
      if(!h) return {error:'No habit matching "'+input.name+'"'};
      h.archived = !!input.archived; save(); reRenderCurrent(); renderNav();
      return {ok:true, habit:h.name, archived:h.archived};
    }
    return {error:'Unknown tool '+name};
  }catch(err){ return {error:String(err && err.message || err)}; }
}

function aiSystemPrompt(){
  var ts = todayStats();
  return "You are the Habit Coach inside HabitOS, a habit-tracking app. Today's date is "+_todayStr+" ("+niceDate(_todayStr)+"). "+
    "The user"+(S.profile.name?' is named '+S.profile.name:'')+" has "+activeHabits().length+" active habit(s). "+
    "Today's completion is "+ts.done+"/"+ts.total+" ("+pct(ts.pct)+"%). Best streak ever: "+bestStreakGlobal()+" days.\n\n"+
    "You can use tools to read or modify the user's habits (add, log, list, get stats, delete, archive). "+
    "Always use list_habits or get_stats before answering questions about their data so you have current numbers — don't guess. "+
    "When adding habits, pick a sensible emoji icon and category yourself unless the user specifies one. "+
    "Be warm, brief, and specific — like a supportive coach, not a generic chatbot. Use short paragraphs, not headers or bullet-heavy answers, since this is a chat panel. "+
    "Never fabricate streaks or numbers — always base them on tool results.";
}

async function callGemini(){
  var url = 'https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent';
  var maxRounds = 5, finalText = '';
  for(var round=0; round<maxRounds; round++){
    var resp = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':GEMINI_API_KEY},
      body: JSON.stringify({
        contents: _aiHistory,
        systemInstruction: { parts:[{ text: aiSystemPrompt() }] },
        tools: GEMINI_TOOLS
      })
    });
    if(!resp.ok){
      var errText = await resp.text(); var errJson;
      try{ errJson = JSON.parse(errText); }catch(e){}
      throw new Error((errJson && errJson.error && errJson.error.message) || ('HTTP '+resp.status));
    }
    var data = await resp.json();
    var cand = data.candidates && data.candidates[0];
    if(!cand) throw new Error('No response from Gemini (possibly blocked by safety filters).');
    var parts = (cand.content && cand.content.parts) || [];
    _aiHistory.push({ role:'model', parts:parts });

    var funcCalls = parts.filter(function(p){ return !!p.functionCall; });
    var textParts = parts.filter(function(p){ return typeof p.text === 'string'; });
    if(textParts.length) finalText += textParts.map(function(p){ return p.text; }).join('\n');

    if(!funcCalls.length) break;

    var responseParts = funcCalls.map(function(fc){
      var result = aiExecuteTool(fc.functionCall.name, fc.functionCall.args || {});
      return { functionResponse: { name: fc.functionCall.name, response: result } };
    });
    _aiHistory.push({ role:'user', parts:responseParts });
  }
  return finalText.trim();
}

async function aiSend(){
  if(_aiBusy) return;
  var inp = document.getElementById('ai-input');
  var text = inp.value.trim();
  if(!text) return;
  inp.value=''; inp.style.height='';
  aiAppendMsg('user', text);
  _aiHistory.push({ role:'user', parts:[{ text:text }] });
  _aiBusy = true;
  document.getElementById('ai-send').disabled = true;
  aiShowThinking();
  try{
    var reply = await callGemini();
    aiHideThinking();
    if(reply) aiAppendMsg('agent', reply);
  }catch(err){
    aiHideThinking();
    aiAppendMsg('agent', "Sorry, I couldn't reach the coach right now (" + (err && err.message || 'unknown error') + "). Try again in a moment.");
  }finally{
    _aiBusy = false;
    document.getElementById('ai-send').disabled = false;
    inp.focus();
  }
}

function addFromTemplate(i){
  var t = TEMPLATES[i];

    reminder:null, createdAt:_todayStr, logs:{}, archived:false
  };
  S.habits.push(h); save();
  toast('Added "'+t.name+'"');
  reRenderCurrent(); go(_curPage);
}

/* ==================================================================
   INIT
   ================================================================== */
var _remindersFiredToday = {};
function checkReminders(){
  if(!S.profile.notif || !('Notification' in window) || Notification.permission!=='granted') return;
  var now = new Date();
  var cur = pad2(now.getHours())+':'+pad2(now.getMinutes());
  activeHabits().forEach(function(h){
    if(!h.reminder || h.reminder!==cur) return;
    if(!isScheduledOn(h,_todayStr)) return;
    if(getStatus(h,_todayStr)==='done') return;
    var key = _todayStr+'|'+h.id;
    if(_remindersFiredToday[key]) return;
    _remindersFiredToday[key] = true;
    try{ new Notification('HabitOS · '+h.icon+' '+h.name, {body:'Time to check in on this habit.', tag:key}); }
    catch(e){}
  });
}
function refreshTodayIfChanged(){
  var real = dateStr(new Date());
  if(real !== _todayStr){
    _todayStr = real;
    _remindersFiredToday = {};
    go(_curPage);
    toast('New day — habits reset for '+niceDate(_todayStr));
  }
  checkReminders();
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeHabitModal(); closeMore(); if(_aiOpen) toggleAI(); }
});
_todayStr = dateStr(new Date());
_calMonth = _todayStr.slice(0,7);
/* called once, right after the first Firestore snapshot for the signed-in user arrives */
function initApp(){
  applyTheme();
  renderNav();
  go('dashboard');
  setInterval(refreshTodayIfChanged, 60000);
}
