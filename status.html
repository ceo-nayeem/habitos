<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Order status — HabitOS</title>
<meta name="description" content="Check the status of your HabitOS Pro payment."/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#08090D"/>
<link rel="icon" type="image/png" sizes="32x32" href="/app/icons/favicon-32.png"/>
<link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png"/>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body>
<div id="ambient" aria-hidden="true"><span></span><span></span></div>
<header class="nav"><div class="wrap">
  <a class="brand" href="/" aria-label="HabitOS home"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg></div><div class="brand-text">HabitOS</div></a>
  <div class="nav-cta"><button class="icon-btn" id="themeBtn" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <a class="btn ghost" href="/app/">Log in</a></div>
</div></header>

<main class="page-narrow" style="max-width:560px">
  <div class="card center">
    <h1 class="page-title">Order status</h1>
    <p class="page-sub">Enter the order reference you received after checkout.</p>
    <form id="f" novalidate style="display:flex;gap:10px;margin-bottom:6px">
      <label class="sr" for="ref">Order reference</label>
      <input class="inp mono" id="ref" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="Order reference" style="text-transform:uppercase"/>
      <button class="btn primary" type="submit">Check</button>
    </form>
    <div id="result" aria-live="polite"></div>
  </div>
  <p class="hint center" style="margin-top:16px">Lost your reference? Email <a href="mailto:hello@veynum.com" style="color:var(--accent)">hello@veynum.com</a> with your Gmail and transaction ID.</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script src="/assets/site.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var qs = new URLSearchParams(location.search), unsub = null;
  var initial = (qs.get('ref') || '').toUpperCase();
  if(!initial){ try{ initial = localStorage.getItem('hos-last-ref') || ''; }catch(e){} }
  $('ref').value = initial;

  function tl(on, cur, title, sub){ return '<div class="tl'+(on?' on':'')+(cur?' cur':'')+'"><i>✓</i><div><b>'+title+'</b><span>'+sub+'</span></div></div>'; }
  function render(d){
    var s = d.status, h = '';
    if(s==='approved'){
      h = '<span class="pill approved">● Verified</span>'+
        '<div class="timeline">'+tl(true,false,'Payment received','We have your transaction ID')+tl(true,false,'Payment verified','Pro is now active')+'</div>'+
        '<div class="notice ok" style="margin-top:18px;text-align:left">Your Pro plan is active. Open HabitOS and sign in with Google using the Gmail you entered at checkout.</div>'+
        '<div class="actions"><a class="btn primary lg" href="/app/">Open HabitOS</a></div>';
    } else if(s==='rejected'){
      h = '<span class="pill rejected">● Not verified</span>'+
        '<div class="notice bad" style="margin-top:18px;text-align:left">We couldn\'t verify this payment'+(d.note?': '+HOS.esc(d.note):'.')+' Please email <a href="mailto:hello@veynum.com" style="color:inherit;font-weight:700">hello@veynum.com</a> with your transaction ID, or submit a new order.</div>'+
        '<div class="actions"><a class="btn primary lg" href="/checkout">Try again</a></div>';
    } else {
      h = '<span class="pill pending">● Verification pending</span>'+
        '<div class="timeline">'+tl(true,false,'Payment received','We have your transaction ID')+tl(false,true,'Verifying','We confirm it in our mobile banking account')+tl(false,false,'Pro activated','On your Google account')+'</div>'+
        '<div class="notice" style="margin-top:18px;text-align:left">This page updates by itself. You can use the Free plan in the meantime by signing in with the Gmail you used at checkout.</div>'+
        '<div class="actions"><a class="btn primary lg" href="/app/">Open HabitOS</a></div>';
    }
    $('result').innerHTML = h;
  }
  function look(ref){
    if(unsub){ unsub(); unsub = null; }
    ref = (ref||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!ref){ $('result').innerHTML = ''; return; }
    if(!HOS.db){ $('result').innerHTML = '<div class="notice bad">Could not connect. Please try again.</div>'; return; }
    $('result').innerHTML = '<p class="hint">Checking…</p>';
    unsub = HOS.db.collection('orderStatus').doc(ref).onSnapshot(function(doc){
      if(!doc.exists){ $('result').innerHTML = '<div class="notice bad" style="text-align:left">We couldn\'t find an order with that reference. Check it and try again.</div>'; return; }
      render(doc.data());
    }, function(){ $('result').innerHTML = '<div class="notice bad" style="text-align:left">We couldn\'t find an order with that reference. Check it and try again.</div>'; });
  }
  $('f').addEventListener('submit', function(e){ e.preventDefault(); history.replaceState(null,'','?ref='+encodeURIComponent($('ref').value.trim().toUpperCase())); look($('ref').value); });
  if(initial) look(initial);
})();
</script>
</body>
</html>
